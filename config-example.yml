# UltiPanel logging and error-reporting configuration example
# Add the following to your config.yml.
#
# Every key listed here has code in src/main/java that reads it. Keys that are
# not read have no effect when written to config.yml, so they are not listed.
#
# Note: the error-reporting block ships with the framework's default config.yml
# and is normally already present in your configuration. It is repeated here so
# that the whole ultipanel section is visible in one place. The other blocks are
# not in the default config.yml and have to be added by hand.
#
# 中文说明：本文件是 UltiPanel 日志与错误上报的配置示例，键的含义见每行注释。
# error-reporting 一段随框架默认 config.yml 一起发布，通常已在你的配置里；
# 其余几段需要自己加。

ultipanel:
  logging:
    # Log levels to transmit.
    # 要传输的日志级别。
    levels:
      - "info"
      - "warning"
      - "error"
      # - "debug"  # Disabled by default; not recommended in production.

    # Loggers to exclude, to avoid transmitting excessive volume.
    # 排除的记录器，避免传输过多日志。
    excluded-loggers:
      - "com.mojang.authlib"
      - "net.minecraft.network"
      - "org.apache.http"
      - "com.zaxxer.hikari"
      - "org.eclipse.jetty"

    # Batched delivery.
    # 批量发送。
    batch:
      enabled: true
      size: 10          # Entries per batch. 批量大小（条数）
      interval: 5000    # Send interval in milliseconds. 发送间隔（毫秒）

    # Automatic error reporting.
    # 错误自动上报。
    error-reporting:
      # Whether to report errors to UltiPanel automatically.
      # 是否启用错误自动上报到 UltiPanel。
      enabled: true
      # Deduplication window in seconds: the same error is reported at most once
      # within this window.
      # 去重窗口（秒），同一错误在此时间内只上报一次。
      dedup-window-seconds: 300
      # Maximum number of errors reported per batch.
      # 每个批次最多上报的错误数量。
      max-errors-per-batch: 10
      # Start sampling once the same error has occurred more than this many times.
      # 同一错误累计超过此次数后开始采样。
      sample-after-count: 10
      # Sampling rate (0.1 = 10%).
      # 采样率（0.1 = 10%）。
      sample-rate: 0.1

    # Rotation knobs for the remote action log — every allowed and denied remote action, one
    # line each. There is deliberately no key here to disable the log: disabling the record of
    # what the panel did is the same move as deleting it, and the log's own forensic purpose is
    # "after a stolen panel account" — an adversary who already holds the operator's identity.
    # 远程操作日志（记录面板每一次被允许或拒绝的操作，每条一行）的轮转配置。这里没有可以
    # 关闭该日志的配置项：关闭「面板做过什么」的记录，等同于删除它；该日志存在的意义之一
    # 正是「面板账号被盗后」的取证——而能改到这里的攻击者，本就已经拿到了运营者的身份。
    action-log:
      # ultipanel.logging.action-log.max-size-bytes — rotation size (bytes) for the active file,
      # plugins/UltiTools/security/action.log.0, before it rolls to the next generation.
      # ultipanel.logging.action-log.max-size-bytes —— action.log.0（当前活跃文件）的单文件
      # 轮转大小（字节），超过后滚动到下一代。
      max-size-bytes: 1048576
      # ultipanel.logging.action-log.max-files — number of rotated action.log.<generation> files
      # to keep (generation 0 is always the active file).
      # ultipanel.logging.action-log.max-files —— 保留的 action.log.<代数> 文件数量
      # （代数 0 始终是当前活跃文件）。
      max-files: 5

  # Capability switches: these bound what the panel may do. A disabled capability produces a
  # refusal naming this file and the exact key to change — it never fails silently. Defaults are
  # split by read/write (v6.3.0): monitoring/logs/player-events/file-read default on because an
  # upgraded server that silently stopped reporting its own liveness is the worst failure shape,
  # where the symptom points the operator the wrong way; commands/file-write/file-delete/
  # server-properties default off.
  # 能力开关：限定面板能做什么。关闭某项能力时，请求会被拒绝，拒绝信息会指向本文件与具体的
  # 配置键，绝不静默失败。默认值按读写拆分（v6.3.0）：monitoring/logs/player-events/file-read
  # 默认开启——升级后的服务器如果连"自己是否在线"这一信号都悄悄停了，是最糟的失败方式（症状
  # 会把人指向错误的方向）；commands/file-write/file-delete/server-properties 默认关闭。
  capabilities:
    # Live server monitoring data (TPS, memory, world/player snapshots). Off stops the panel's
    # "server is alive" heartbeat.
    # 服务器实时监控数据（TPS、内存、世界/玩家快照）。关闭后面板会失去"服务器在线"的心跳信号。
    monitoring: true
    # Streaming and controlling the live console log. Off stops the panel's live log view.
    # 实时控制台日志流与控制。关闭后面板无法查看实时日志。
    logs: true
    # Live player join/quit/chat events. Off stops the panel's live player activity feed.
    # 玩家上线/下线/聊天等实时事件。关闭后面板失去实时玩家活动信息。
    player-events: true
    # Reading and listing files within the editable roots below. Off stops the panel's file
    # browser and downloads.
    # 在下方可编辑根目录内读取与列出文件。关闭后面板无法浏览或下载文件。
    file-read: true
    # Writing or uploading files within the editable roots. Off stops the panel from saving any
    # file edit or upload.
    # 在可编辑根目录内写入或上传文件。关闭后面板无法保存任何文件修改或上传。
    file-write: false
    # Deleting files or directories within the editable roots. Off stops the panel's delete
    # action entirely (a directory delete also requires an explicit recursive flag even when on).
    # 在可编辑根目录内删除文件或目录。关闭后面板完全无法执行删除（即使开启，删除目录也仍需
    # 显式的 recursive 标志）。
    file-delete: false
    # Executing server commands remotely, subject to the blocklist below. Off stops all remote
    # command execution regardless of the blocklist's contents.
    # 远程执行服务器命令，仍受下方黑名单约束。关闭后无论黑名单内容如何，远程命令执行都完全
    # 停止。
    commands: false
    # Reading and editing server.properties safe keys. Off stops the panel's server.properties
    # editor.
    # 读取与编辑 server.properties 的安全白名单键。关闭后面板无法编辑 server.properties。
    server-properties: false

  commands:
    # Remote command blocklist. Fully operator-editable in both directions — add or remove any
    # entry, including emptying the list entirely. There is no allowlist tier and no
    # unoverridable floor: the panel is the operator's remote console, and no framework veto
    # protects an operator who chooses to empty this list. The compensating control is the
    # action log above, which records every command the panel executes regardless of what this
    # list contains.
    #
    # These ten entries are the shipped judgement call, not a guarantee of completeness. Bukkit
    # commands are an open space this list does not claim to enumerate exhaustively — an
    # operator relying on it as a complete dangerous-command list will be surprised. Emptying
    # this list permits every command the panel's underlying account can run; this file is
    # tracked and public, so which specific commands become newly reachable is deliberately not
    # enumerated here.
    #
    # 远程命令黑名单，运营者可双向自由编辑——增删任意条目，甚至清空整份列表。没有白名单层
    # 级，也没有不可覆盖的强制底线：面板就是运营者自己的远程控制台，框架不会替运营者的选择
    # 设置否决权。配套的补偿控制是上面的操作日志——无论这份名单内容如何，面板执行的每条命令
    # 都会被记录。
    #
    # 出厂的这十条是一个判断取舍，不是"已穷举完整"的保证。Bukkit 命令是一个开放空间，本列表
    # 并不声称覆盖全部危险命令；把它当作完整清单来依赖会让运营者感到意外。清空本列表意味着
    # 面板底层账号能执行的所有命令都将变为可达——由于本文件被跟踪且公开，具体哪些命令因此变
    # 得可达，这里刻意不予列举。
    blocklist:
      - "op"
      - "deop"
      - "stop"
      - "restart"
      - "reload"
      - "ban-ip"
      - "pardon-ip"
      - "whitelist"
      - "save-off"
      - "save-all"

  files:
    # The set of directories (relative to the server root) the panel's file-read/file-write/
    # file-delete capabilities are confined to. This is one axis; the capabilities above are the
    # other — roots answer "where", capabilities answer "which verb". A credential-bearing file
    # inside one of these roots (data.json and similar patterns) is still refused unconditionally
    # and cannot be reopened by adding a root — that exclusion is not configurable here.
    # 面板 file-read/file-write/file-delete 能力被限定的目录集合（相对服务器根目录）。这是一
    # 条轴，上面的能力开关是另一条轴——根目录回答"在哪"，能力开关回答"能做什么"。即使某个根
    # 目录内含凭据类文件（data.json 及同类模式），仍会被无条件拒绝，且无法通过新增根目录重新
    # 打开——该排除项不在此处可配置。
    editable-roots:
      - "plugins"
      - "logs"
