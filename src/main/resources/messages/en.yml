    all: "All <total:'0'> modules reloaded."
config:
  binding:
    timer_rule: "a bound @Scheduled period or delay must be a whole number of seconds from 1 to <max:'0'> (0 does not mean off)"
    cooldown_rule: "a bound @CmdCD cooldown must be a whole number of seconds from 0 (no cooldown) to <max:'0'>"
    cooldown_invalid: "it has value <value> after the reload; <rule>"
    reload_incomplete: "the reload of <file> did not complete (for example, its write-back threw an IOException), so its values were not validated"
    scheduled_kept: "config-bound @Scheduled <task>: <config> key '<config_key>' has value <value> after the reload (<rule>); the running <seconds:'0'>s is kept"
    scheduled_not_validated: "config-bound @Scheduled <task>: the reload of <file> did not complete, so <config> key '<config_key>' was not applied; the running <seconds:'0'>s is kept"
    cooldown_kept: "config-bound @CmdCD <binding> was not updated: <reason>; the running <seconds:'0'>s is kept"
    scheduled_invalid_warning: "<module>: <task> is bound to <config> key '<config_key>', which has value <value> after the reload; <rule>; keeping <seconds:'0'>s"
