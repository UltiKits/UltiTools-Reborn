    cooldown_not_updated_warning: "<module>: @CmdCD bound to <binding> is not updated: <reason>; keeping <seconds:'0'>s"
    step_failed: "applying the reloaded config-bound <what> values failed: <cause>; updates applied before the failure remain in effect; remaining updates did not complete"
    off_thread: "config-bound @Scheduled and @CmdCD values were not applied: the reload ran off the main thread"
