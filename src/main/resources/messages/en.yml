    status: "<white>/ulticloud status<gray> - Show link and connection status"
    reconnect: "<white>/ulticloud reconnect<gray> - Retry the UltiCloud connection now"

bootstrap_content:
  summary: "Module '<module>' added custom content at this start: <enchantments> enchantment(s), <tags> tag change(s), <datapacks> data pack(s)."
  removed: "<yellow>Module '<module>' is no longer installed, but it had added custom content (<content>)."
  dropped: "<yellow>Module '<module>' no longer adds: <content>."
  unknown: "The record of which modules added custom content could not be read; warnings about removing such modules may be incomplete until every module has started once."
  list: "<enchantments> enchantment(s), <tags> tag(s), <datapacks> data pack(s)"
  consequence:
    enchantment: "<red>  This enchantment is lost for good from every item that carries it, once the item's chunk is loaded and saved."
    datapack: "<red>  The recipes and advancements its data packs brought are gone."
    tag: "  The item categories it added no longer apply."
  worldgen_refused: "<red>Module '<module>' was not loaded: its data pack '<pack>' adds world-generation content (<path>), which UltiTools 7.0.0 does not allow."
upm:
  help:
    pending: "/upm pending - List module changes waiting for a restart"
    revoke: "/upm revoke \\<module> - Undo one of them"
    title: "<green>========|Plugin Install Help|========"
    list: "<green>/upm list [page] - View available plugin list"
    install: "<green>/upm install [plugin] - Install latest plugin"
    install_version: "<green>/upm install [plugin] [version] - Install certain version plugin"
    versions: "<green>/upm versions [plugin] - View plugin version list"
    uninstall: "<green>/upm uninstall [plugin] - Uninstall plugin"
    check: "<green>/upm check - View available updates"
    update: "<green>/upm update [plugin] - Update a plugin"
    update_all: "<green>/upm update all - Update all plugins"
  install:
    not_staged: "<red>Could not add the install request for <module> to the pending changes: <reason>."
    already_current: "<yellow><module> <version> is already installed and running; nothing changed."
    as_update: "<green><module> is already installed (version <from>), so this counts as an update: <from> → <version> at the next restart. Undo with /upm revoke <module>."
    cancelled_uninstall: "<green>Replaced: <module> was waiting to be uninstalled; it will now stay and be updated from <from> to <version> at the next restart. Undo with /upm revoke <module>."
    cancelled_uninstall_same: "<green>Cancelled the pending uninstall of <module>; it stays installed at <version>."
    cancelled_update_same: "<green>Cancelled the pending update of <module> to <old_version>; it stays at <version>."
    failed: "<red>Install Failed!"
    not_recorded: "<red>Could not add <module> to the pending changes: <error>. Nothing changed."
    queued: "<green>Added to the pending changes: <module> <version> will be installed at the next restart. Undo with /upm revoke <module>."
    refused:
      target_exists: "<red>A file named <file> already exists in the modules folder. Move or delete it before installing."
      integrity_failed: "<red>Refused to install <module> <version>: the file did not pass its integrity check against the catalogue (its SHA-256 or size does not match, or the catalogue gave no usable hash or size). Nothing was written to the modules folder."
      jar_invalid: "<red>Refused to install <module> <version>: the downloaded file is not a valid module JAR. The download was deleted; nothing was written to the modules folder."
      jar_level_refused: "<red>Refused to install <module> <version>: the downloaded JAR declares api-version <declared>. This UltiTools-API is at API level <level:'0'> and installs only modules declaring api-version <floor:'0'> to <max:'0'>. The download was deleted; nothing was written to the modules folder."
      jar_no_level: "<red>Refused to install <module> <version>: the downloaded JAR declares no api-version. This UltiTools-API is at API level <level:'0'> and installs only modules declaring api-version <floor:'0'> to <max:'0'>. The download was deleted; nothing was written to the modules folder."
      licence_required: "<red>Cannot install <module> <version>: this version requires a licence and is not offered for public download. Nothing was written to the modules folder."
      no_compatible_version: "<red>Cannot install <module>: UltiCloud has no version of it that this server can install. This UltiTools-API is at API level <level:'0'> and installs only modules declaring api-version <floor:'0'> to <max:'0'>. Nothing was written to the modules folder."
      version_incompatible: "<red>Cannot install <module> <version>: that version cannot be installed on this server. This UltiTools-API is at API level <level:'0'> and installs only modules declaring api-version <floor:'0'> to <max:'0'>. Nothing was written to the modules folder."
    replaced_install: "<green>Replaced: <module> was waiting to be installed at <old_version>; it will now be installed at <version> at the next restart. Undo with /upm revoke <module>."
  pending:
    busy: "<yellow>A change of <module> is downloading right now. Try again in a moment; nothing changed."
    empty: "<gray>No module changes are waiting for a restart."
    entry:
      install: "<white><index:'0'>. <green>Install</green> <module> <to>"
      requested: "<gray>    requested by <who> at <time>"
      uninstall: "<white><index:'0'>. <red>Uninstall</red> <module> <from> <gray>(deletes <files>)"
      update: "<white><index:'0'>. <yellow>Update</yellow> <module> <from> → <to>"
    footer: "<gray>These take effect at the next restart. Undo one with /upm revoke \\<module name>."
    header: "<gold>Module changes waiting for the next restart:"
    last_start:
      applied:
        install: "<green>  Installed <module> <to>"
        uninstall: "<green>  Uninstalled <module> <from>"
        update: "<green>  Updated <module> <from> → <to>"
      header: "<gold>Results of the last start:"
      needs_operator: "<red>  A change of <module> needs manual attention; see the start-up log"
      not_applied: "<red>  The change of <module> could not be applied; see the start-up log"
      rolled_back:
        install: "<red>  <module> <to> did not load and was removed again"
        update: "<red>  <module> <to> did not load; <from> was restored"
    needs_operator: "<red>A change of <module> needs manual attention: <failure>. See <file>. Nothing changed."
    notice:
      last_start_ok: "<green>[UltiTools] At the last start <count:'0'> module change(s) took effect."
      last_start_problems: "<red>[UltiTools] At the last start <count:'0'> module change(s) were restored or need attention. <click:run_command:'/upm pending'><u>/upm pending</u></click> for details."
      waiting: "<yellow>[UltiTools] <count:'0'> module change(s) are waiting for a restart. <click:run_command:'/upm pending'><u>/upm pending</u></click> to review or undo them."
    previous_failed: "<red>The previous change of <module> could not be applied at the last restart: <failure>"
    requester:
      console: "the console"
      player: "<name>"
      remote: "<name> (remote)"
      unknown: "an earlier version"
    state:
      downloading: "<gray>    still downloading"
      failed: "<red>    could not be applied at the last restart: <failure>. This entry cannot be undone; the next request for <module> will report it."
      in_progress: "<yellow>    the last start stopped halfway; the next start finishes it. It cannot be undone now."
      needs_operator: "<red>    needs manual attention: <failure>. Record: <file>. This entry cannot be undone here."
    truncated: "<gray>… and <count:'0'> more."
    unchanged: "<yellow><module> <version> is already waiting for the next restart; nothing changed."
    unfinished: "<yellow>The previous start stopped before it finished the change of <module>. Restart the server first; nothing changed."
    warning:
      datapack: "<red><bold>Warning:</bold> <module> brings its own data packs. After the restart that removes it, the recipes and advancements they bring disappear."
      enchantment: "<red><bold>Warning:</bold> <module> added custom enchantments. After the restart that removes it, this enchantment is lost for good from every item that carries it (once the item's chunk is loaded and saved); items another plugin stored as raw bytes cannot be read while it is missing."
      other: "<gray>Note: <module> added custom content of another kind (<kind>)."
      revoke_hint: "<gray>If you still need this content, run /upm revoke <module> before restarting."
      tag: "<gray>Note: the item categories <module> added will stop working."
      unknown: "<gray>This module may have added custom content; check before uninstalling it."
  reason:
    access_denied: "a file access was denied: <error>"
    ambiguous_identify_string: "the identify-string <module> is declared by more than one loaded module in different JARs (<modules>), so which one to update cannot be determined; give each module its own identify-string"
    cancelled_while_downloading: "the download was cancelled before it could be queued"
    download_failed: "the download failed: <error>"
    incompatible_api_level: "the downloaded <file> declares api-version <declared>, but this UltiTools-API is at API level <level:'0'> and installs only modules declaring api-version <floor:'0'> to <max:'0'>"
    invalid_jar: "the downloaded file <file> is not a valid module JAR"
    leftover_backup: "<folder> holds a previous-version JAR an earlier update kept and no record refers to; check it and move it away first"
    needs_operator: "an update of this module is on hold for the operator (<failure>); resolve it as the start-up log says, then delete the update record <file> and the folder of the same name"
    no_api_level: "the downloaded <file> declares no api-version, but this UltiTools-API is at API level <level:'0'> and installs only modules declaring api-version <floor:'0'> to <max:'0'>"
    no_compatible_update: "UltiCloud has no version of <module> that this server can install (this UltiTools-API is at API level <level:'0'> and installs only modules declaring api-version <floor:'0'> to <max:'0'>)"
    no_download: "UltiCloud has no downloadable version of <module>"
    no_identify_string: "the module has no identify-string"
    not_in_modules_folder: "the module's JAR <file> is not in the modules folder <folder>"
    not_loaded: "no loaded module declares identify-string <module>"
    old_jar_unreadable: "the module's current JAR <file> cannot be read"
    other_copy_loads_first: "another copy of this module would load instead of the new JAR <file> at the next start, because these JARs in the modules folder declare the same main class and sort before it by file name: <files>; remove them first, then run /upm update again"
    previous_unrestored: "the previous JAR the last update kept could not be moved back into the modules folder: <error>"
    record_failed: "the update record could not be written: <error>"
    record_unreadable: "the module's existing update record <file> could not be read: <error>"
    shared_jar: "its JAR <file> is also the JAR of the loaded module <modules>, which the update would replace too"
    staged_unreadable: "the downloaded <file> could not be read (<error>)"
    wrong_identity: "the downloaded <file> does not declare identify-string <module> and a version"
    wrong_version: "the download <file> declares version <declared>, not the latest version <version> the catalogue offered"
  revoke:
    action:
      install: "install"
      uninstall: "uninstall"
      update: "update"
    done:
      downloading: "<green>Cancelled the download for <module>; it will not be added to the pending changes."
      install: "<green>Undone: <module> <to> will not be installed."
      uninstall: "<green>Undone: <module> stays installed and keeps running."
      update: "<green>Undone: <module> stays at <from> (the update to <to> is cancelled)."
    failed: "<red>Could not undo the change of <module>: <error>. Nothing changed."
    not_found: "<yellow><module> has no change waiting for a restart."
    not_revocable:
      failed: "<red>The change of <module> could not be applied at the last restart and cannot be undone: <failure>."
      in_progress: "<red>The change of <module> is unfinished from the last start and cannot be undone now; the next start finishes it."
      needs_operator: "<red>The change of <module> needs manual attention and cannot be undone here: <failure>. Record: <file>."
    panel_log: "Panel user #<user_id> revoked the pending <action> of <module>."
  start:
    install:
      not_recorded: "The install of module <module> <version> was rolled back before loading because its transaction record could not be written. Install it again with /upm install."
      cleanup_deferred: "Module <module> <version> is installed, but its transaction folder <folder> could not be cleaned up; the next start will retry."
      committed: "Module <module> <version> is installed: this start loaded it."
      cross_file_system: "The install of module <module> <version> was not applied: the modules folder <folder> and the transaction folder <work> are on different file systems."
      failed: "The install of module <module> <version> was not applied: <error>."
      rollback_deferred: "Could not remove module <module> <version> after an unsuccessful install (<error>). If the JAR remains in the modules folder, it may load; the next start will recover the transaction."
      rolled_back: "Module <module> <version> was installed but did not load at this start, so it was removed again. See the errors above; install it again with /upm install once the cause is fixed."
      target_exists: "The install of module <module> <version> was not applied: <file> already exists in <folder>. Nothing in the modules folder was changed."
      unconfirmed: "The install of module <module> <version> was put in place by a start that ended before it could confirm the module loaded; it was removed again. Install it again with /upm install."
    removal:
      failed: "Could not delete <file> while uninstalling module <module> (<error>); it may load at this start and the next start will retry."
      removed: "Uninstalled module <module>: deleted <files>."
      skipped: "Did not delete <file> while uninstalling module <module>: it differs from the recorded file. This uninstall was dropped for that file, so the module can still load. Run /upm uninstall again if you still want to remove it."
      unreadable: "Could not read <file> while uninstalling module <module> (<error>) to confirm its identity; it was not deleted, and the next start will retry."
    update:
      committed: "Module <module> updated from <old_version> to <new_version>: this start confirmed the new version loaded, and the old JAR has been deleted."
