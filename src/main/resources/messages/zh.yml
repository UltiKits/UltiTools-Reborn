# Framework messages use stable dotted keys and MiniMessage values.
command:
  error:
    op_required: "<red>你没有权限执行这个指令！"
    no_permission: "<gray>执行此命令需要 <white><permission> <gray>权限"
    player_only: "只有游戏内可以执行这个指令！"
    console_only: "只可以在后台执行这个指令！"
    sender_locked: "<red>请先等待上一条命令执行完毕！"
    server_locked: "<red>请先等待其他玩家发送的命令执行完毕！"
    cooldown: "<red>操作频繁，请 <seconds:'0'> 秒后再试"
    execution_failed: "<red>命令执行出错: <error>"
  async:
    processing: "<yellow>处理中..."
    timeout: "<red>命令执行超时，已停止等待，命令仍在后台继续执行"
  reply:
    unknown: "<red>未知指令，请使用/<label> <help>获取帮助"
    usage: "<yellow>正确用法: <gray>/<label> <format>"
    argument_error: "<red><error>"
ui:
  ok: "确定"
  "yes": "是"
  "no": "否"
  submit: "提交"
  cancel: "取消"
text:
  fallback:
    time_zone: "后备语言：<language>（系统时区 <zone>；可在 config.yml 中设置 fallback-language 覆盖）"
    configured: "后备语言：<language>（配置选择；可在 config.yml 中设置 fallback-language 覆盖）"
