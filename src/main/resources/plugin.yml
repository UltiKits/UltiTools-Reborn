name: UltiTools
version: '${project.version}'
main: com.ultikits.ultitools.UltiTools
api-version: '1.19'
prefix: UltiTools
authors: [ wisdomme ]
load: POSTWORLD
softdepend:
  - Vault
  - PlaceholderAPI

# Maven Central libraries downloaded by Paper for the framework.
# Gson, MySQL, protobuf and slf4j use Paper's bundled copies on every supported build.
# Paper 为框架下载的 Maven Central 依赖；Gson、MySQL、protobuf、slf4j 使用所有受支持构建自带的副本。
libraries:
  - commons-dbutils:commons-dbutils:1.8.1
  - org.java-websocket:Java-WebSocket:1.5.4
  - net.bytebuddy:byte-buddy:1.18.3
  - com.sun.mail:javax.mail:1.6.2
  - com.zaxxer:HikariCP:5.1.0
  - com.github.cryptomorin:XSeries:13.0.0
