name: UltiTools
version: '${project.version}'
main: com.ultikits.ultitools.UltiTools
api-version: '1.19'
prefix: UltiTools
authors: [ wisdomme ]
load: POSTWORLD
softdepend:
  - Vault
  - PlaceholderAPI

# Maven Central libraries downloaded by Paper for the framework.
# Gson, MySQL, protobuf and slf4j use Paper's bundled copies on every build measured (see COMPATIBILITY.md).
# Paper 为框架下载的 Maven Central 依赖；Gson、MySQL、protobuf、slf4j 使用 Paper 自带的副本（所有实测构建均自带，见 COMPATIBILITY.md）。
libraries:
  - commons-dbutils:commons-dbutils:1.8.1
  - org.java-websocket:Java-WebSocket:1.6.0
  - net.bytebuddy:byte-buddy:1.18.15
  - com.sun.mail:javax.mail:1.6.2
  - com.zaxxer:HikariCP:7.1.0
  - com.github.cryptomorin:XSeries:14.0.0
