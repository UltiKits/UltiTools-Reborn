# 数据存储方式，内置json, sqlite和mysql，酌情更改，
# 每个存储方式之间的数据不是互通的，切换存储方式会导致数据丢失
# json: 可以手动更改内容，但是性能稳定性最低，崩溃下可能会丢失数据
# sqlite: 本地文件存储，性能稳定性较高，但是无法轻易手动更改数据
# mysql: 需要配置mysql数据库，性能稳定性最高，但是需要自行创建数据库
datasource:
  type: "sqlite"
  # 仅对json存储有效，数据自动保存时间（秒），高性能机器可酌情调低
  # 越低数据越不容易丢失，但是性能消耗越大
  # 越高性能消耗越小，但是数据丢失可能性越大
  flushRate: 10

# en for English, zh 为中文
language: "zh"

mysql:
  enable: false
  host: localhost
  port: 3306
  username: root
  password: password
  database: ultitools
  connectionTimeout: 30000
  keepaliveTime: 60000
  maxLifetime: 1800000
  connectionTestQuery: "select 1"
  maximumPoolSize: 8
  cachePrepStmts: true
  prepStmtCacheSize: 250
  prepStmtCacheSqlLimit: 2048

# 邮件服务配置 (Email Service Configuration)
# 此服务为可选功能，仅在enable为true且配置正确时启用
# 模块需调用 EmailService.isEnabled() 检查服务是否可用
email:
  enable: false
  smtp:
    # SMTP服务器地址 (如: smtp.gmail.com, smtp.qq.com, smtp.163.com)
    host: "smtp.example.com"
    # SMTP端口 (常用: 25, 465(SSL), 587(TLS))
    port: 587
    # SMTP认证用户名 (通常是邮箱地址)
    username: ""
    # SMTP认证密码 (部分服务商需要使用授权码而非密码)
    password: ""
    # 是否使用SSL加密 (端口465时通常为true)
    ssl: false
    # 是否使用STARTTLS加密 (端口587时通常为true)
    starttls: true
    # 连接超时时间 (毫秒)
    connectionTimeout: 10000
    # 读取超时时间 (毫秒)
    readTimeout: 10000
  from:
    # 发件人邮箱地址 (需与username一致或为授权的别名)
    address: "noreply@example.com"
    # 发件人显示名称
    name: "UltiTools Server"
  # 调试模式 (开启后会在控制台输出详细的SMTP通信日志)
  debug: false

# UltiPanel 面板集成配置
ultipanel:
  logging:
    error-reporting:
      # 是否启用错误自动上报到 UltiPanel (Enable auto error reporting to UltiPanel)
      enabled: true
      # 去重窗口时间（秒），同一错误在此时间内只上报一次
      dedup-window-seconds: 300
      # 每个批次最多上报的错误数量
      max-errors-per-batch: 10
      # 同一错误累计超过此次数后开始采样
      sample-after-count: 10
      # 采样率（0.1 = 10%）
      sample-rate: 0.1
    # Rotation knobs for the remote action-log — no key here can disable the log itself (D-32).
    action-log:
      # Rotation size (bytes) for the active file, plugins/UltiTools/security/action.log.0, before
      # it rolls to the next generation.
      # action.log.0（当前活跃文件）的单文件轮转大小（字节），超过后滚动到下一代。
      max-size-bytes: 1048576
      # Number of rotated action.log.<generation> files to keep (generation 0 is always active).
      # There is no key to disable this log.
      # 保留的 action.log.<代数> 文件数量（代数 0 始终是当前活跃文件）。没有可以关闭这份日志的配置项。
      max-files: 5
    # Grouping the live log stream sent to the panel into batches instead of one message per line.
    # 面板日志流是否按批次分组发送，而不是逐行发送。
    batch:
      # Whether batching is enabled; disabling sends every log line immediately as its own message.
      # 是否启用批量发送；关闭后每条日志都会作为独立消息立即发送。
      enabled: true
      # Number of queued log entries that triggers an early send, ahead of the interval below.
      # A value below 1 is rejected at boot and the compiled-in default is kept, matching the
      # panel's own live config action's behaviour.
      # 触发提前发送的已排队日志条数，会早于下面的时间间隔触发发送。
      # 小于 1 的值会在启动时被拒绝，保留内置默认值，与面板自身实时 config 动作的行为一致。
      size: 10
      # Milliseconds between scheduled batch sends. This key is read from this file each time a
      # panel connection opens (LogStreamManager#initialize calls loadBatchConfiguration() on
      # every connect and reconnect), not once at server start. `ul reload` re-reads this file
      # but does not reopen the panel connection, so restarting the server is the dependable way
      # to apply a changed value here. Once a connection is already open, sending this same
      # interval through the panel's own live config action reschedules the already-running
      # sender immediately (#432), without waiting for a reconnect. A value below 1000ms is
      # rejected (including zero or negative) and the previous interval stays in effect -- both
      # this connection-open path and the panel's own live path share the same 1000ms floor
      # (WR-01).
      # 定时批量发送的间隔（毫秒）。这个键会在每次面板连接建立时从本文件重新读取
      # （LogStreamManager#initialize 调用 loadBatchConfiguration()，每次连接和重连都会触发这次
      # 读取），而非仅在服务器启动的那一次读取。`ul reload` 会重新读取本文件，但不会重新建立面板
      # 连接，所以重启服务器才是让改动生效的可靠方式。如果连接已经建立，通过面板自身的实时
      # config 动作下发同一个间隔值，也会让正在运行的发送任务立即改用新值（#432），不必等待重连。
      # 低于 1000 毫秒的值（含 0 和负数）都会被拒绝，此前生效的间隔保持不变——连接建立时读取的
      # 这条路径与面板自身的实时路径共用同一个 1000 毫秒下限（WR-01）。
      interval: 5000
  # 远程能力开关：这些开关限定了面板能做什么；关闭某项能力时，相应请求会被拒绝，
  # 拒绝信息会指向本文件。
  # Capability switches: these bound what the panel may do; a disabled capability
  # produces a refusal naming this file.
  capabilities:
    # Whether the panel may receive live server monitoring data (TPS, memory, world/player snapshots).
    # 面板是否可以接收服务器实时监控数据（TPS、内存、世界/玩家快照）。
    monitoring: true
    # Whether the panel receives the live console log stream.
    # 面板是否可以接收实时控制台日志流。
    logs: true
    # Whether the panel may receive live player join/quit/chat events.
    # 面板是否可以接收玩家上线/下线/聊天等实时事件。
    player-events: true
    # Whether the panel may read and list files within the editable roots.
    # 面板是否可以在可编辑根目录内读取与列出文件。
    file-read: true
    # Whether the panel may write or upload files within the editable roots.
    # 面板是否可以在可编辑根目录内写入或上传文件。
    file-write: false
    # Whether the panel may delete files or directories within the editable roots.
    # 面板是否可以在可编辑根目录内删除文件或目录。
    file-delete: false
    # Whether the panel may execute server commands remotely.
    # 面板是否可以远程执行服务器命令。
    commands: false
    # Whether the panel may read and edit server.properties safe keys.
    # 面板是否可以读取与编辑 server.properties 的安全白名单键。
    server-properties: false
