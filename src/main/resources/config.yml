# 数据存储方式，内置json, sqlite和mysql，酌情更改，
# 每个存储方式之间的数据不是互通的，切换存储方式会导致数据丢失
# json: 可以手动更改内容，但是性能稳定性最低，崩溃下可能会丢失数据
# sqlite: 本地文件存储，性能稳定性较高，但是无法轻易手动更改数据
# mysql: 需要配置mysql数据库，性能稳定性最高，但是需要自行创建数据库
datasource:
  type: "sqlite"
  # 仅对json存储有效，数据自动保存时间（秒），高性能机器可酌情调低
  # 越低数据越不容易丢失，但是性能消耗越大
  # 越高性能消耗越小，但是数据丢失可能性越大
  flushRate: 10

# en for English, zh 为中文
language: "zh"

mysql:
  enable: false
  host: localhost
  port: 3306
  username: root
  password: password
  database: ultitools
  connectionTimeout: 30000
  keepaliveTime: 60000
  maxLifetime: 1800000
  connectionTestQuery: "select 1"
  maximumPoolSize: 8
  cachePrepStmts: true
  prepStmtCacheSize: 250
  prepStmtCacheSqlLimit: 2048

# 邮件服务配置 (Email Service Configuration)
# 此服务为可选功能，仅在enable为true且配置正确时启用
# 模块需调用 EmailService.isEnabled() 检查服务是否可用
email:
  enable: false
  smtp:
    # SMTP服务器地址 (如: smtp.gmail.com, smtp.qq.com, smtp.163.com)
    host: "smtp.example.com"
    # SMTP端口 (常用: 25, 465(SSL), 587(TLS))
    port: 587
    # SMTP认证用户名 (通常是邮箱地址)
    username: ""
    # SMTP认证密码 (部分服务商需要使用授权码而非密码)
    password: ""
    # 是否使用SSL加密 (端口465时通常为true)
    ssl: false
    # 是否使用STARTTLS加密 (端口587时通常为true)
    starttls: true
    # 连接超时时间 (毫秒)
    connectionTimeout: 10000
    # 读取超时时间 (毫秒)
    readTimeout: 10000
  from:
    # 发件人邮箱地址 (需与username一致或为授权的别名)
    address: "noreply@example.com"
    # 发件人显示名称
    name: "UltiTools Server"
  # 调试模式 (开启后会在控制台输出详细的SMTP通信日志)
  debug: false

# UltiPanel 面板集成配置
ultipanel:
  logging:
    error-reporting:
      # 是否启用错误自动上报到 UltiPanel (Enable auto error reporting to UltiPanel)
      enabled: true
      # 去重窗口时间（秒），同一错误在此时间内只上报一次
      dedup-window-seconds: 300
      # 每个批次最多上报的错误数量
      max-errors-per-batch: 10
      # 同一错误累计超过此次数后开始采样
      sample-after-count: 10
      # 采样率（0.1 = 10%）
      sample-rate: 0.1
    # Rotation knobs for the remote action-log — no key here can disable the log itself (D-32).
    action-log:
      # Rotation size (bytes) for the active file, plugins/UltiTools/security/action.log.0, before
      # it rolls to the next generation.
      # action.log.0（当前活跃文件）的单文件轮转大小（字节），超过后滚动到下一代。
      max-size-bytes: 1048576
      # Number of rotated action.log.<generation> files to keep (generation 0 is always active).
      # There is no key to disable this log.
      # 保留的 action.log.<代数> 文件数量（代数 0 始终是当前活跃文件）。没有可以关闭这份日志的配置项。
      max-files: 5
    # Batching of the live log stream for the deprecated protocol v1 sender. The UltiCloud protocol 2.1.0
    # session this framework runs ignores all three keys below: it sends `log.lines` about once a second
    # (a full batch at once). Editing them changes nothing unless a module still drives the deprecated
    # LogStreamManager#initialize, which the framework itself never calls.
    # 面向已弃用的协议 v1 发送器的实时日志批量发送设置。框架使用的 UltiCloud 协议 2.1.0 会话会忽略下面
    # 三个键：它大约每秒发送一次 `log.lines`（批次已满时立即发送）。除非某个模块仍在调用已弃用的
    # LogStreamManager#initialize（框架自身从不调用），否则修改它们没有任何效果。
    batch:
      # v1 sender only: whether batching is enabled; disabling sends every live log line immediately
      # as its own message. Ignored by the protocol 2.1.0 session.
      # 仅 v1 发送器：是否启用批量发送；关闭后每条实时日志都会作为独立消息立即发送。协议 2.1.0 会话忽略此键。
      enabled: true
      # v1 sender only: number of queued log entries that triggers an early send, ahead of the interval
      # below. A value below 1 is rejected and the compiled-in default is kept. Ignored by the
      # protocol 2.1.0 session.
      # 仅 v1 发送器：触发提前发送的已排队日志条数，早于下面的时间间隔触发。小于 1 的值会被拒绝，
      # 保留内置默认值。协议 2.1.0 会话忽略此键。
      size: 10
      # v1 sender only: milliseconds between scheduled batch sends; a value below 1000 is rejected and
      # the previous interval stays in effect. The deprecated sender takes the value from the loaded
      # configuration each time LogStreamManager#initialize runs, so an edit needs `ul reload` first. Ignored by the
      # protocol 2.1.0 session.
      # 仅 v1 发送器：定时批量发送的间隔（毫秒）；低于 1000 的值会被拒绝，此前生效的间隔保持不变。
      # 已弃用的发送器每次执行 LogStreamManager#initialize 时从已加载的配置读取该值，所以修改后需要先执行 `ul reload`。协议 2.1.0
      # 会话忽略此键。
      interval: 5000
  commands:
    # Commands the panel may never execute remotely. Fully operator-editable — add or remove entries freely.
    # 面板永远不允许远程执行的命令列表。完全由操作员编辑——可自由增删。
    blocklist:
      - op
      - deop
      - stop
      - restart
      - reload
      - ban-ip
      - pardon-ip
      - whitelist
      - save-off
      - save-all
  files:
    # Directories the panel's file API may read/write/delete within, subject to the capability switches above.
    # 面板文件 API 可以在其中读取/写入/删除的目录，仍受上方能力开关约束。
    editable-roots:
      - plugins
      - logs
  # 远程能力开关：这些开关限定了面板能做什么；关闭某项能力时，相应请求会被拒绝，
  # 拒绝信息会指向本文件。
  # Capability switches: these bound what the panel may do; a disabled capability
  # produces a refusal naming this file.
  capabilities:
    # Whether the panel may receive live server monitoring data (TPS, memory, world/player snapshots).
    # 面板是否可以接收服务器实时监控数据（TPS、内存、世界/玩家快照）。
    monitoring: true
    # Whether the panel receives the live console log stream.
    # 面板是否可以接收实时控制台日志流。
    logs: true
    # Whether the panel may receive live player join, quit and command events (there is no chat event).
    # 面板是否可以接收玩家上线、下线与命令等实时事件（没有聊天事件）。
    player-events: true
    # Whether the panel may read and list files within the editable roots.
    # 面板是否可以在可编辑根目录内读取与列出文件。
    file-read: true
    # Whether the panel may write or upload files within the editable roots.
    # 面板是否可以在可编辑根目录内写入或上传文件。
    file-write: false
    # Whether the panel may delete files within the editable roots. Directories are never deleted remotely.
    # 面板是否可以在可编辑根目录内删除文件。目录永远不会被远程删除。
    file-delete: false
    # Whether the panel may execute server commands remotely.
    # 面板是否可以远程执行服务器命令。
    commands: false
    # Whether the panel may read and edit server.properties safe keys.
    # 面板是否可以读取与编辑 server.properties 的安全白名单键。
    server-properties: false
    # Whether the panel may stop or restart this server through the structured power action, which does not pass through the command blocklist.
    # 面板是否可以通过结构化电源动作停止或重启本服务器；该动作不经过命令黑名单。
    power-actions: false
    # Whether the panel may kick players, change their game mode or teleport them.
    # 面板是否可以踢出玩家、修改他们的游戏模式或传送他们。
    player-actions: false
