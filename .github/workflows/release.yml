name: 🚀 Manual Release

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: '发布类型'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - prerelease
      release_notes:
        description: '发布说明 (可选，留空则使用最近提交信息)'
        required: false
        type: string
      dry_run:
        description: '试运行模式 (不实际发布)'
        required: false
        default: false
        type: boolean

jobs:
  # ==================== 验证阶段 ====================
  validate:
    name: ✅ Validate & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # 🔐 使用受保护的 Environment，需要在 GitHub Settings 中配置
    # 设置路径: Repository Settings → Environments → 创建 "release" → Required reviewers
    environment: release
    outputs:
      version: ${{ steps.version.outputs.version }}
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # 获取完整历史用于生成 changelog
    
    - name: ☕ Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: 🏷️ Get Project Version from pom.xml
      id: version
      uses: avides/actions-project-version-check@v1.4.0
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        file-to-check: pom.xml
        only-return-version: true

    - name: 🔍 Check Version Format
      run: |
        VERSION=${{ steps.version.outputs.version }}
        echo "📦 准备发布版本: ${VERSION}"
        
        # 检查版本号是否包含 SNAPSHOT
        if [[ "$VERSION" == *"SNAPSHOT"* ]]; then
          echo "❌ 错误: 版本号包含 SNAPSHOT，请先更新 pom.xml 中的版本号"
          exit 1
        fi
        
        # 检查 tag 是否已存在
        if git rev-parse "v${VERSION}" >/dev/null 2>&1; then
          echo "❌ 错误: Tag v${VERSION} 已存在，请更新版本号"
          exit 1
        fi
        
        echo "✅ 版本号检查通过"

    - name: 🧪 Run Tests
      run: mvn -B clean test
      
    - name: 📊 Generate Test Report
      if: always()
      run: |
        echo "## 🧪 测试结果" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        if [ -f target/surefire-reports/TEST-*.xml ]; then
          TESTS=$(grep -h "tests=" target/surefire-reports/TEST-*.xml | head -1 | sed 's/.*tests="\([0-9]*\)".*/\1/')
          FAILURES=$(grep -h "failures=" target/surefire-reports/TEST-*.xml | head -1 | sed 's/.*failures="\([0-9]*\)".*/\1/')
          ERRORS=$(grep -h "errors=" target/surefire-reports/TEST-*.xml | head -1 | sed 's/.*errors="\([0-9]*\)".*/\1/')
          echo "| 指标 | 数值 |" >> $GITHUB_STEP_SUMMARY
          echo "|------|------|" >> $GITHUB_STEP_SUMMARY
          echo "| 总测试数 | ${TESTS:-N/A} |" >> $GITHUB_STEP_SUMMARY
          echo "| 失败数 | ${FAILURES:-0} |" >> $GITHUB_STEP_SUMMARY
          echo "| 错误数 | ${ERRORS:-0} |" >> $GITHUB_STEP_SUMMARY
        else
          echo "⚠️ 未找到测试报告" >> $GITHUB_STEP_SUMMARY
        fi

  # ==================== 构建阶段 ====================
  build:
    name: 🔨 Build Release
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
    
    - name: ☕ Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: 🔨 Build with Maven
      run: mvn -B package javadoc:javadoc -DskipTests

    - name: 📦 Archive artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ultitools-release-${{ needs.validate.outputs.version }}
        path: target/UltiTools-API-${{ needs.validate.outputs.version }}.jar

    - name: 📚 Archive JavaDoc
      uses: actions/upload-artifact@v4
      with:
        name: javadoc-${{ needs.validate.outputs.version }}
        path: target/site/apidocs/

  # ==================== 发布阶段 ====================
  release:
    name: 🚀 Create Release
    needs: [validate, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: ${{ github.event.inputs.dry_run != 'true' }}
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: 💬 Generate Release Notes
      id: notes
      env:
        RELEASE_NOTES: ${{ github.event.inputs.release_notes }}
      run: |
        if [ -n "$RELEASE_NOTES" ]; then
          NOTES="$RELEASE_NOTES"
        else
          # 获取自上次 tag 以来的提交信息
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -n "$LAST_TAG" ]; then
            NOTES=$(git log ${LAST_TAG}..HEAD --pretty=format:"- %s (%h)" | head -50)
          else
            NOTES=$(git log --pretty=format:"- %s (%h)" -10)
          fi
        fi
        # 转义多行文本
        NOTES="${NOTES//'%'/'%25'}"
        NOTES="${NOTES//$'\n'/'%0A'}"
        NOTES="${NOTES//$'\r'/'%0D'}"
        echo "notes=${NOTES}" >> $GITHUB_OUTPUT

    - name: 📥 Download artifacts
      uses: actions/download-artifact@v4
      with:
        name: ultitools-release-${{ needs.validate.outputs.version }}

    - name: 🎉 Create GitHub Release
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: v${{ needs.validate.outputs.version }}
        release_name: Release v${{ needs.validate.outputs.version }}
        body: |
          ## 🎉 UltiTools-API v${{ needs.validate.outputs.version }}
          
          ### 📝 更新内容
          ${{ steps.notes.outputs.notes }}
          
          ---
          📦 **下载**: 点击下方 `UltiTools-API.jar` 下载
          📚 **文档**: https://dev.ultikits.com/
        draft: false
        prerelease: ${{ github.event.inputs.release_type == 'prerelease' }}

    - name: 📤 Upload Release Asset
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: UltiTools-API-${{ needs.validate.outputs.version }}.jar
        asset_name: UltiTools-API.jar
        asset_content_type: application/java-archive

    - name: 📚 Deploy JavaDoc
      uses: actions/download-artifact@v4
      with:
        name: javadoc-${{ needs.validate.outputs.version }}
        path: javadoc/
        
    - name: 📚 Upload JavaDoc to FTP
      uses: SamKirkland/FTP-Deploy-Action@v4.3.4
      with:
        server: ${{ secrets.FTP_HOST }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: "./javadoc/"

    - name: 📝 Release Summary
      env:
        VERSION: ${{ needs.validate.outputs.version }}
        RELEASE_TYPE: ${{ github.event.inputs.release_type }}
        ACTOR: ${{ github.actor }}
        REPO: ${{ github.repository }}
      run: |
        echo "## 🎉 发布成功!" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| 信息 | 值 |" >> $GITHUB_STEP_SUMMARY
        echo "|------|------|" >> $GITHUB_STEP_SUMMARY
        echo "| **版本** | \`v${VERSION}\` |" >> $GITHUB_STEP_SUMMARY
        echo "| **类型** | ${RELEASE_TYPE} |" >> $GITHUB_STEP_SUMMARY
        echo "| **发布者** | @${ACTOR} |" >> $GITHUB_STEP_SUMMARY
        echo "| **时间** | $(date -u '+%Y-%m-%d %H:%M:%S UTC') |" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "🔗 [查看 Release](https://github.com/${REPO}/releases/tag/v${VERSION})" >> $GITHUB_STEP_SUMMARY

  # ==================== 试运行报告 ====================
  dry-run-report:
    name: 📋 Dry Run Report
    needs: [validate, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: ${{ github.event.inputs.dry_run == 'true' }}
    
    steps:
    - name: 📋 Dry Run Summary
      env:
        VERSION: ${{ needs.validate.outputs.version }}
        RELEASE_TYPE: ${{ github.event.inputs.release_type }}
        ACTOR: ${{ github.actor }}
      run: |
        echo "## 🔍 试运行报告 (Dry Run)" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "⚠️ **这是试运行模式，未实际创建 Release**" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| 信息 | 值 |" >> $GITHUB_STEP_SUMMARY
        echo "|------|------|" >> $GITHUB_STEP_SUMMARY
        echo "| **版本** | \`v${VERSION}\` |" >> $GITHUB_STEP_SUMMARY
        echo "| **类型** | ${RELEASE_TYPE} |" >> $GITHUB_STEP_SUMMARY
        echo "| **发布者** | @${ACTOR} |" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "✅ 所有检查通过，可以正式发布" >> $GITHUB_STEP_SUMMARY
