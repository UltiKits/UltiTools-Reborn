name: 🔑 GPG Key Expiry

# Warns ahead of time when the GPG signing key used for Maven Central releases is about to expire.
#
# Key expiry is silent: everyday mvn test / mvn package does not sign, and mvn clean verify on a
# PR does not sign either (signing lives only in the release profile), so it only ever surfaces
# when gpg:sign actually runs on release day. This job checks once a month and turns red once
# fewer than 30 days remain.
#
# Uses only the public key, and touches no secret. The public key is fetched from the keyserver by
# fingerprint -- the fingerprint is public information, distributed alongside every .asc signature
# pushed to Maven Central, and exists precisely so a consumer can verify the signature.
#
# ⚠ The schedule trigger only fires for a workflow on the **default branch**. This repository's
#   default branch is main, while development happens on alpha, so the scheduled warning only
#   really starts running once alpha is merged into main. Until then, the real-time gate on the
#   publish path (the key-validity check inside publish-packages.yml) is the primary line of
#   defense.

on:
  schedule:
    # 09:00 UTC on the 1st of every month
    - cron: '0 9 1 * *'
  workflow_dispatch:
  # Self-tests when the check script itself changes, so this warning system does not quietly break.
  pull_request:
    paths:
      - '.github/workflows/gpg-key-expiry.yml'
      - '.github/scripts/check-gpg-expiry.sh'

permissions:
  contents: read

jobs:
  check-expiry:
    name: GPG key expiry check
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4 (v4.3.1)

      - name: 🔎 Fetch public key from keyserver
        env:
          # Update this in step when the signing key rotates. This is the public-key fingerprint,
          # not a credential.
          KEY_FPR: 2334303E84CA28D14B6A0746C27654300A2E94D6
        run: |
          set -euo pipefail

          # Uses keyserver.ubuntu.com. Do not switch to keys.openpgp.org: for an unverified key it
          # strips the uid, and the response really is an HTTP 200 with a well-formed PGP block,
          # but gpg's import then skips it with "contains no user ID - skipped" and the keyring
          # ends up empty. An HTTP success does not mean the key was actually obtained.
          curl -sSf --retry 3 --retry-delay 5 --max-time 30 \
            -o pubkey.asc \
            "https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x${KEY_FPR}&options=mr"

          # The import output includes the uid (the maintainer's email); this is a public log on a
          # public repository, so it is discarded rather than printed.
          gpg --batch --import pubkey.asc > /dev/null 2>&1 || true

          # Assert this exact key was actually imported, not just that something unparseable
          # came back.
          if ! gpg --list-keys --with-colons "${KEY_FPR}" > /dev/null 2>&1; then
            echo "::error::got a response from the keyserver, but ${KEY_FPR: -16} was not successfully imported into the keyring."
            echo "        Check whether this key is still on the keyserver, or whether the fingerprint has changed."
            exit 1
          fi

      - name: ⏳ Check remaining validity
        run: .github/scripts/check-gpg-expiry.sh --mode public --warn-days 30 --fail-on-warn
