name: UltiTools API CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "main", "alpha" ]

jobs:
  # ==================== Test Stage ====================
  test:
    name: 🧪 Test & Coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
    
    - name: ☕ Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: 🧪 Build & Test with Coverage
      # verify, not test: the shade filters, resource filtering, jar packaging and javadoc
      # generation are all bound to the package phase, so running test alone would leave them
      # to execute for the first time only after merging.
      # No need to disable signing: maven-gpg-plugin lives only in the release profile and is
      # not active by default.
      run: mvn -B clean verify
      
    - name: 📊 Generate JaCoCo Coverage Report
      run: mvn -B jacoco:report
      
    - name: 📈 JaCoCo Coverage Report Summary
      id: jacoco
      uses: cicirello/jacoco-badge-generator@v2
      with:
        jacoco-csv-file: target/site/jacoco/jacoco.csv
        badges-directory: .github/badges
        generate-coverage-badge: true
        generate-branches-badge: true
        generate-summary: true
        
    - name: 📋 Display Coverage Summary
      run: |
        echo "## 📊 Test Coverage Report" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
        echo "|------|------|" >> $GITHUB_STEP_SUMMARY
        echo "| **Line coverage** | ${{ steps.jacoco.outputs.coverage }}% |" >> $GITHUB_STEP_SUMMARY
        echo "| **Branch coverage** | ${{ steps.jacoco.outputs.branches }}% |" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 📁 Detailed Coverage Data" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
        cat target/site/jacoco/jacoco.csv | head -20 >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
        
    - name: 📤 Upload Coverage Report
      uses: actions/upload-artifact@v4
      with:
        name: jacoco-coverage-report
        path: target/site/jacoco/
        retention-days: 30
        
    - name: 📤 Upload Test Results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: target/surefire-reports/
        retention-days: 30
        
    - name: 📤 Upload japicmp Report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: japicmp-report
        path: target/japicmp/
        retention-days: 30
        
    - name: ✅ Coverage Gate Check
      run: |
        COVERAGE=${{ steps.jacoco.outputs.coverage }}
        BRANCHES=${{ steps.jacoco.outputs.branches }}
        echo "📊 Current line coverage: ${COVERAGE}%"
        echo "📊 Current branch coverage: ${BRANCHES}%"
        # A coverage threshold check could be set here
        # if (( $(echo "$COVERAGE < 50" | bc -l) )); then
        #   echo "❌ Coverage below 50%, build failed"
        #   exit 1
        # fi
        echo "✅ Tests passed, coverage meets requirements"

    - name: 📤 Upload Coverage to Codacy
      if: github.event_name == 'push'
      env:
        CODACY_API_TOKEN: ${{ secrets.CODACY_API_TOKEN }}
        CODACY_ORGANIZATION_PROVIDER: gh
        CODACY_USERNAME: UltiKits
        CODACY_PROJECT_NAME: UltiTools-Reborn
      run: bash <(curl -Ls https://coverage.codacy.com/get.sh) report -r target/site/jacoco/jacoco.xml

  # ==================== Isolated Test Stage ====================
  # TaskManagerTest is tagged @Tag("isolated") because it mutates global scheduler state, so it
  # is excluded from the default `mvn -B clean verify` run above (see pom.xml's excludedGroups
  # property). This job gives it its own Maven invocation and its own build directory - a
  # separate job rather than a second step in the `test` job (D-28) - so it cannot observe or
  # overwrite the other job's surefire output or the japicmp report, and so its own isolation
  # from global scheduler state is real rather than nominal.
  test-isolated:
    name: 🧪 Isolated Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: ☕ Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: 🧪 Run isolated-tagged tests
      # -Dgroups=isolated selects only the isolated tag; -DexcludedGroups= clears pom.xml's
      # default exclusion (which would otherwise still filter this class out).
      run: mvn -B test -Dgroups=isolated -DexcludedGroups=

    - name: 📤 Upload Isolated Test Results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: isolated-test-results
        path: target/surefire-reports/
        retention-days: 30

  # ==================== Build SNAPSHOT Stage ====================
  build-snapshot:
    name: 🔨 Build SNAPSHOT
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # alpha is the development trunk, so a SNAPSHOT artifact is only meaningful for it; the
    # official artifact on main is produced by publish-packages.yml at release time.
    if: github.event_name == 'push' && github.ref == 'refs/heads/alpha'
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
    
    - name: ☕ Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: 🏷️ Get Project Version from pom.xml
      id: version
      uses: avides/actions-project-version-check@v1.4.0
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        file-to-check: pom.xml
        only-return-version: true

    - name: 🔧 Set SNAPSHOT Version
      id: snapshot
      run: |
        BASE_VERSION=${{ steps.version.outputs.version }}
        # Remove any existing -SNAPSHOT suffix, then add the new one
        CLEAN_VERSION=${BASE_VERSION%-SNAPSHOT}
        SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
        SNAPSHOT_VERSION="${CLEAN_VERSION}-SNAPSHOT-${SHORT_SHA}"
        echo "snapshot_version=${SNAPSHOT_VERSION}" >> $GITHUB_OUTPUT
        echo "📦 SNAPSHOT version: ${SNAPSHOT_VERSION}"
        # Update the version number in pom.xml
        mvn versions:set -DnewVersion=${SNAPSHOT_VERSION} -DgenerateBackupPoms=false
        
    - name: 🔨 Build SNAPSHOT with Maven
      run: mvn -B package javadoc:javadoc -DskipTests

    - name: 📦 Archive SNAPSHOT artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ultitools-snapshot-${{ steps.snapshot.outputs.snapshot_version }}
        path: target/UltiTools-API-${{ steps.snapshot.outputs.snapshot_version }}.jar
        retention-days: 14
        

    - name: 📝 SNAPSHOT Build Summary
      run: |
        echo "## 📦 SNAPSHOT Build Complete" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Info | Value |" >> $GITHUB_STEP_SUMMARY
        echo "|------|------|" >> $GITHUB_STEP_SUMMARY
        echo "| **Version** | \`${{ steps.snapshot.outputs.snapshot_version }}\` |" >> $GITHUB_STEP_SUMMARY
        echo "| **Commit** | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
        echo "| **Branch** | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
        echo "| **Triggered by** | @${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "💡 **Tip**: SNAPSHOT artifacts are retained for 14 days and can be downloaded from Artifacts" >> $GITHUB_STEP_SUMMARY
