name: UltiTools API CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: 🧪 Test & Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      with:
        fetch-depth: 0

    - name: Classify changed paths
      id: changes
      run: python3 -I .github/scripts/ci_changed_paths.py

    - name: Plain-documentation fast path
      if: steps.changes.outputs.build != 'true'
      run: echo 'Only plain documentation changed; the required test check passes without a Maven build.'

    - name: ☕ Set up JDK 21
      if: steps.changes.outputs.build == 'true'
      uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: 🧪 Build & Test with Coverage
      # Verify also exercises packaging, API compatibility and deprecation-registry checks.
      if: steps.changes.outputs.build == 'true'
      run: mvn -B clean verify

    - name: Verify checkout remains clean
      if: steps.changes.outputs.build == 'true'
      run: |
        STATUS="$(git status --porcelain)"
        if [ -n "$STATUS" ]; then
          printf '%s\n' "$STATUS"
          exit 1
        fi

    - name: 🧪 Run isolated-tagged tests
      # A fresh Maven/Surefire JVM still isolates scheduler state. Reuse compiled classes, not reports.
      # JaCoCo appends execution data and the test-bound report includes both invocations.
      if: steps.changes.outputs.build == 'true'
      run: |
        mv target/surefire-reports target/regular-surefire-reports
        mvn -B test -Dgroups=isolated -DexcludedGroups=

    - name: CJK Comment/Javadoc Scope Gate
      # Lightweight checks run even on the fast path; do not hide changes to their own mechanism.
      run: .github/scripts/check-cjk-scope.sh

    - name: Verification instrument self-tests
      run: |
        bash .github/scripts/check-cjk-scope.sh --self-test
        bash .github/scripts/test-buildtool-lifecycle.sh --self-test

    - name: 📤 Upload Coverage Report
      if: steps.changes.outputs.build == 'true'
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: jacoco-coverage-report
        path: target/site/jacoco/
        retention-days: 7

    - name: 📤 Upload Test Results
      if: always() && steps.changes.outputs.build == 'true'
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: test-results
        path: |
          target/surefire-reports/
          target/regular-surefire-reports/
        retention-days: 7

    - name: 📤 Upload japicmp Report
      if: always() && steps.changes.outputs.build == 'true'
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: japicmp-report
        path: target/japicmp/
        retention-days: 7

    - name: 📤 Upload Coverage to Codacy
      if: steps.changes.outputs.build == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main' || steps.changes.outputs.build == 'true' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
      env:
        CODACY_API_TOKEN: ${{ secrets.CODACY_API_TOKEN }}
        CODACY_ORGANIZATION_PROVIDER: gh
        CODACY_USERNAME: UltiKits
        CODACY_PROJECT_NAME: UltiTools-Reborn
      run: |
        set -euo pipefail
        REPORTER="$RUNNER_TEMP/codacy-coverage-reporter"
        curl --fail --location --retry 3 --output "$REPORTER" \
          https://github.com/codacy/codacy-coverage-reporter/releases/download/14.1.3/codacy-coverage-reporter-linux
        printf '%s  %s\n' '15c5f052207d27b8501ab5d5910c68c206ea70b0157ee1725132780530580875' "$REPORTER" | sha256sum --check --strict
        chmod +x "$REPORTER"
        "$REPORTER" report -r target/site/jacoco/jacoco.xml

  release-tooling:
    name: Release tooling regression suites
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      with:
        fetch-depth: 0

    - name: Classify changed paths
      id: changes
      run: python3 -I .github/scripts/ci_changed_paths.py

    - name: ☕ Set up JDK 21
      if: steps.changes.outputs.tooling == 'true'
      uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Set up pinned Maven for Central staging
      if: steps.changes.outputs.tooling == 'true'
      run: bash .github/scripts/setup-pinned-maven.sh

    - name: Resolve release probe dependencies
      # Run flatten online to populate its runtime realm, then resolve the offline Central probe dependencies.
      if: steps.changes.outputs.tooling == 'true'
      run: mvn -B -ntp process-resources dependency:resolve-plugins

    - name: Release tooling regression suites
      if: steps.changes.outputs.tooling == 'true'
      run: python3 -B -I -m unittest discover -s .github/scripts/tests -p 'test_*.py' -v

    - name: Verify release tests leave checkout clean
      if: steps.changes.outputs.tooling == 'true'
      run: |
        STATUS="$(git status --porcelain)"
        if [ -n "$STATUS" ]; then
          printf '%s\n' "$STATUS"
          exit 1
        fi
