name: UltiTools API CI

on:
  push:
    branches: [main, release/**]
  pull_request:
    branches: [main, release/**]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: 🧪 Test & Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      # Only a boolean leaves this scope; the token itself stays in the upload step.
      CODACY_TOKEN_PRESENT: ${{ secrets.CODACY_API_TOKEN != '' }}
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        fetch-depth: 0

    - name: Classify changed paths
      id: changes
      run: python3 -I .github/scripts/ci_changed_paths.py

    - name: Plain-documentation fast path
      if: steps.changes.outputs.build != 'true'
      run: echo 'Only plain documentation changed; the required test check passes without a Maven build.'

    - name: ☕ Set up JDK 21
      if: steps.changes.outputs.build == 'true'
      uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: 🧪 Build & Test with Coverage
      # Verify also exercises packaging, API compatibility and deprecation-registry checks.
      if: steps.changes.outputs.build == 'true'
      run: mvn -B clean verify

    - name: Verify checkout remains clean
      if: steps.changes.outputs.build == 'true'
      run: |
        STATUS="$(git status --porcelain)"
        if [ -n "$STATUS" ]; then
          printf '%s\n' "$STATUS"
          exit 1
        fi

    - name: 🧪 Run isolated-tagged tests
      # A fresh Maven/Surefire JVM still isolates scheduler state. Reuse compiled classes, not reports.
      # JaCoCo appends execution data and the test-bound report includes both invocations.
      if: steps.changes.outputs.build == 'true'
      run: |
        mv target/surefire-reports target/regular-surefire-reports
        mvn -B test -Dgroups=isolated -DexcludedGroups=

    - name: CJK Comment/Javadoc Scope Gate
      # Lightweight checks run even on the fast path; do not hide changes to their own mechanism.
      run: .github/scripts/check-cjk-scope.sh

    - name: Verification instrument self-tests
      run: |
        bash .github/scripts/check-cjk-scope.sh --self-test
        bash .github/scripts/test-buildtool-lifecycle.sh --self-test

    - name: 📤 Upload Coverage Report
      if: steps.changes.outputs.build == 'true'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: jacoco-coverage-report
        path: target/site/jacoco/
        retention-days: 7

    - name: 📤 Upload Test Results
      if: always() && steps.changes.outputs.build == 'true'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: test-results
        path: |
          target/surefire-reports/
          target/regular-surefire-reports/
        retention-days: 7

    - name: 📤 Upload japicmp Report
      if: always() && steps.changes.outputs.build == 'true'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: japicmp-report
        path: target/japicmp/
        retention-days: 7

    - name: 📦 Cache Codacy Coverage Reporter
      # Same guard as the upload step; the cached binary is still SHA-256 verified before every use.
      if: steps.changes.outputs.build == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main' || steps.changes.outputs.build == 'true' && env.CODACY_TOKEN_PRESENT == 'true' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/codacy-coverage-reporter/14.1.3
        key: codacy-coverage-reporter-14.1.3-15c5f052207d27b8501ab5d5910c68c206ea70b0157ee1725132780530580875

    - name: 📤 Upload Coverage to Codacy
      # Main pushes must fail visibly if the secret is missing; secret-free PRs still skip upload.
      if: steps.changes.outputs.build == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main' || steps.changes.outputs.build == 'true' && env.CODACY_TOKEN_PRESENT == 'true' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
      env:
        CODACY_API_TOKEN: ${{ secrets.CODACY_API_TOKEN }}
        CODACY_ORGANIZATION_PROVIDER: gh
        CODACY_USERNAME: UltiKits
        CODACY_PROJECT_NAME: UltiTools-Reborn
      run: |
        set -euo pipefail
        if [ -z "$CODACY_API_TOKEN" ]; then
          echo '::error::CODACY_API_TOKEN is required for coverage upload'
          exit 1
        fi
        REPORTER_DIR="$HOME/.cache/codacy-coverage-reporter/14.1.3"
        REPORTER="$REPORTER_DIR/codacy-coverage-reporter"
        if [ ! -f "$REPORTER" ]; then
          mkdir -p "$REPORTER_DIR"
          curl --fail --location --retry 6 --retry-delay 10 --retry-all-errors \
            --connect-timeout 20 --max-time 120 --output "$REPORTER" \
            https://github.com/codacy/codacy-coverage-reporter/releases/download/14.1.3/codacy-coverage-reporter-linux
        fi
        # Verified on every run, whether the binary came from the cache or from a fresh download.
        printf '%s  %s\n' '15c5f052207d27b8501ab5d5910c68c206ea70b0157ee1725132780530580875' "$REPORTER" | sha256sum --check --strict
        chmod +x "$REPORTER"
        "$REPORTER" report -r target/site/jacoco/jacoco.xml

  real-mysql:
    name: Real MySQL comparison contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    services:
      mysql:
        image: mysql:9.1.0
        env:
          MYSQL_DATABASE: ultitools_it_ci
          MYSQL_USER: ultitools_it
          MYSQL_PASSWORD: integration-only
          MYSQL_ROOT_PASSWORD: integration-root-only
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping --host=127.0.0.1 --user=ultitools_it --password=integration-only --silent" --health-interval=10s --health-timeout=5s --health-retries=12
    env:
      # Disposable service credentials, not production secrets.
      ULTITOOLS_TEST_MYSQL_PASSWORD: integration-only
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Set up JDK 21
      uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
    - name: Run real MySQL comparison contracts with fresh reports
      run: mvn -B clean test -Dtest=RelationalLiteralMatchTest,RelationalOrderingContractTest,ConditionValueParityTest -Dultitools.test.mysql.url='jdbc:mysql://127.0.0.1:3306/ultitools_it_ci?allowPublicKeyRetrieval=true&useSSL=false' -Dultitools.test.mysql.user=ultitools_it
    - name: Require every real MySQL lane to execute without skips
      run: |
        python3 -I - <<'PYTHON'
        from pathlib import Path
        import xml.etree.ElementTree as ET

        package = "com.ultikits.ultitools.interfaces.impl.data."
        required = {package + name + "$RealMysql": [] for name in (
            "RelationalLiteralMatchTest", "RelationalOrderingContractTest", "ConditionValueParityTest")}
        for report in Path("target/surefire-reports").glob("TEST-*.xml"):
            root = ET.parse(report).getroot()
            for case in root.iter("testcase"):
                if case.get("classname") in required:
                    required[case.get("classname")].append(case)
        for classname, cases in required.items():
            if not cases or any(case.find(tag) is not None
                                for case in cases for tag in ("skipped", "failure", "error")):
                raise SystemExit("Real MySQL lane missing, skipped or failed: " + classname)
            print(classname + ": " + str(len(cases)) + " executed, zero skipped/failures/errors")
        PYTHON

  release-tooling:
    name: Release tooling regression suites
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        fetch-depth: 0

    - name: Classify changed paths
      id: changes
      run: python3 -I .github/scripts/ci_changed_paths.py

    - name: ☕ Set up JDK 21
      if: steps.changes.outputs.tooling == 'true'
      uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Set up pinned Maven for Central staging
      if: steps.changes.outputs.tooling == 'true'
      run: bash .github/scripts/setup-pinned-maven.sh

    - name: Resolve release probe dependencies
      # Run flatten online to populate its runtime realm, then resolve the offline Central probe dependencies.
      if: steps.changes.outputs.tooling == 'true'
      run: mvn -B -ntp process-resources dependency:resolve-plugins

    - name: Release tooling regression suites
      if: steps.changes.outputs.tooling == 'true'
      run: python3 -B -I -m unittest discover -s .github/scripts/tests -p 'test_*.py' -v

    - name: Verify release tests leave checkout clean
      if: steps.changes.outputs.tooling == 'true'
      run: |
        STATUS="$(git status --porcelain)"
        if [ -n "$STATUS" ]; then
          printf '%s\n' "$STATUS"
          exit 1
        fi
