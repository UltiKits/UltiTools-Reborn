name: 📦 Publish to GitHub Packages

on:
  release:
    types: [published]

jobs:
  publish:
    name: 📦 Publish Maven Package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: ☕ Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
        server-id: github

    - name: 🏷️ Extract version from tag
      id: version
      run: |
        VERSION=${GITHUB_REF_NAME#v}
        echo "version=${VERSION}" >> $GITHUB_OUTPUT
        echo "Publishing version: ${VERSION}"

    - name: 🔧 Set version from release tag
      env:
        VERSION: ${{ steps.version.outputs.version }}
      run: mvn versions:set -DnewVersion="${VERSION}" -DgenerateBackupPoms=false

    - name: 🔨 Build package
      run: mvn -B clean package -Dgpg.skip=true -Dmaven.test.skip=true

    - name: 📦 Publish to GitHub Packages
      env:
        VERSION: ${{ steps.version.outputs.version }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        mvn deploy:deploy-file \
          -DgroupId=com.ultikits \
          -DartifactId=UltiTools-API \
          -Dversion="${VERSION}" \
          -Dpackaging=jar \
          -Dfile="target/UltiTools-API-${VERSION}.jar" \
          -DpomFile=pom.xml \
          -DrepositoryId=github \
          -Durl=https://maven.pkg.github.com/UltiKits/UltiTools-Reborn

    - name: 📝 Publish Summary
      env:
        VERSION: ${{ steps.version.outputs.version }}
      run: |
        echo "## Published to GitHub Packages" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Info | Value |" >> $GITHUB_STEP_SUMMARY
        echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
        echo "| **Group ID** | \`com.ultikits\` |" >> $GITHUB_STEP_SUMMARY
        echo "| **Artifact ID** | \`UltiTools-API\` |" >> $GITHUB_STEP_SUMMARY
        echo "| **Version** | \`${VERSION}\` |" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Maven Dependency" >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`xml" >> $GITHUB_STEP_SUMMARY
        echo "<dependency>" >> $GITHUB_STEP_SUMMARY
        echo "    <groupId>com.ultikits</groupId>" >> $GITHUB_STEP_SUMMARY
        echo "    <artifactId>UltiTools-API</artifactId>" >> $GITHUB_STEP_SUMMARY
        echo "    <version>${VERSION}</version>" >> $GITHUB_STEP_SUMMARY
        echo "    <scope>provided</scope>" >> $GITHUB_STEP_SUMMARY
        echo "</dependency>" >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
