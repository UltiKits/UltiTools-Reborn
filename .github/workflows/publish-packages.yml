name: 📦 Publish Release

on:
  release:
    types: [published]

jobs:
  validate:
    name: 🏷️ Validate tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
    - name: 🏷️ Extract and validate version from tag
      # Both publish jobs get the version from here now, instead of each parsing GITHUB_REF_NAME
      # separately. One fewer duplication means one fewer place to drift — coordinates pushed to
      # Maven Central are irrevocable (Central does not allow overwriting or deleting a published
      # coordinate), so both jobs must use the same, already-validated string.
      #
      # This layer guards the path that bypasses .github/scripts/release.sh: creating a release
      # directly on the GitHub web UI, or manually pushing a tag. The entry-point script can
      # refuse before a tag is even created, but only when someone actually runs it; this layer
      # cannot stop a tag from being created, but it can stop a bad version number from being
      # published.
      id: version
      run: |
        set -euo pipefail
        VERSION="${GITHUB_REF_NAME#v}"
        if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "::error::the version parsed from tag ${GITHUB_REF_NAME} does not match MAJOR.MINOR.PATCH; the release has been aborted."
          echo "::error::parsed result was [${VERSION}]. Delete this release and tag, then re-publish with the correct version number."
          exit 1
        fi
        echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
        echo "${GITHUB_REF_NAME} -> ${VERSION}"

  publish-github:
    name: 📦 GitHub Packages
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      # contents: read -- the job only downloads the retained assets of the published release.
      contents: read
      packages: write

    steps:
    - name: 📥 Checkout code
      # The tag's commit; release_artifacts.py checks the retained files against it.
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4 (v4.3.1)

    - name: ☕ Set up JDK 21
      uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4 (v4.8.0)
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: 📥 Download and verify the retained release files
      # Publication consumes the bytes that were accepted, never a new build. release.sh --prepare built
      # one candidate and retained its primary JAR, POM, sources and javadoc JARs with a SHA-256 manifest;
      # UAT and the maintainer accepted exactly those bytes, and release.sh --publish-approved attached
      # them to this release. A rebuild here would differ at least in ZIP timestamps, so its hash would
      # no longer be the one UAT holds. This step downloads the five assets and checks the manifest, every
      # size and raw SHA-256, the source commit, tree and pom.xml bytes, and that the tag names the
      # accepted commit. Any missing or changed asset stops the job before anything is published.
      id: retained
      env:
        VERSION: ${{ needs.validate.outputs.version }}
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        INPUTS="$RUNNER_TEMP/retained-inputs"
        BASE="UltiTools-API-${VERSION}"
        mkdir "$INPUTS"
        gh release download "$GITHUB_REF_NAME" --dir "$INPUTS" \
          --pattern "${BASE}.jar" --pattern "${BASE}.pom" --pattern "${BASE}-sources.jar" \
          --pattern "${BASE}-javadoc.jar" --pattern "${BASE}-release-manifest.json"
        python3 -I .github/scripts/release_artifacts.py validate \
          --manifest "$INPUTS/${BASE}-release-manifest.json" --source-checkout "$GITHUB_WORKSPACE" \
          --expected-source-head "$GITHUB_SHA" --tag "$GITHUB_REF_NAME"
        echo "inputs=$INPUTS" >> "$GITHUB_OUTPUT"
    - name: 📦 Publish the retained JAR and POM to GitHub Packages
      # deploy:deploy-file uploads the retained JAR and the retained POM byte for byte (-DpomFile with
      # -DgeneratePom=false): no POM is generated or rewritten. The coordinate keeps the lower-case
      # artifactId ultitools-api this package has always used. The repository is read before and after:
      # absent -> deploy, identical -> nothing to do, anything else (different bytes, a partial coordinate,
      # an unreadable answer) fails the job and never overwrites. A failed deploy is a failure, not
      # "probably already there"; only the read-back of identical bytes counts as published.
      id: publish-ghp
      env:
        VERSION: ${{ needs.validate.outputs.version }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        INPUTS: ${{ steps.retained.outputs.inputs }}
      run: |
        set -euo pipefail
        BASE="UltiTools-API-${VERSION}"
        MANIFEST="$INPUTS/${BASE}-release-manifest.json"
        REPOSITORY="https://maven.pkg.github.com/UltiKits/UltiTools-Reborn"
        state() {
          python3 -I .github/scripts/release_artifacts.py repository-state --manifest "$MANIFEST" \
            --base-url "$REPOSITORY" --artifact-id ultitools-api --token-env GITHUB_TOKEN
        }
        BEFORE="$(state)"
        if [ "$BEFORE" = "STATE=absent" ]; then
          SETTINGS="$RUNNER_TEMP/github-packages-settings.xml"
          ( umask 077 && printf '<settings><servers><server><id>github</id><username>${env.GITHUB_ACTOR}</username><password>${env.GITHUB_TOKEN}</password></server></servers></settings>' > "$SETTINGS" )
          (
            # Outside the checkout, so no project POM is read.
            cd "$RUNNER_TEMP"
            mvn -B deploy:deploy-file -s "$SETTINGS" \
              -DgroupId=com.ultikits -DartifactId=ultitools-api -Dversion="$VERSION" -Dpackaging=jar \
              -Dfile="$INPUTS/${BASE}.jar" -DpomFile="$INPUTS/${BASE}.pom" -DgeneratePom=false \
              -DrepositoryId=github -Durl="$REPOSITORY"
          )
          echo "result=published" >> "$GITHUB_OUTPUT"
        elif [ "$BEFORE" = "STATE=identical" ]; then
          echo "GitHub Packages already serves these exact bytes; nothing is deployed."
          echo "result=already-identical" >> "$GITHUB_OUTPUT"
        else
          echo "::error::unexpected GitHub Packages state [${BEFORE}]"
          exit 1
        fi
        AFTER="$(state)"
        if [ "$AFTER" != "STATE=identical" ]; then
          echo "::error::GitHub Packages does not serve the retained bytes after the deploy [${AFTER}]."
          exit 1
        fi
        # The retained files themselves are unchanged after the upload.
        python3 -I .github/scripts/release_artifacts.py validate --manifest "$MANIFEST"

    - name: 📝 Publish Summary
      env:
        VERSION: ${{ needs.validate.outputs.version }}
      run: |
        echo "## Published to GitHub Packages" >> $GITHUB_STEP_SUMMARY
        echo '```xml' >> $GITHUB_STEP_SUMMARY
        echo "<dependency>" >> $GITHUB_STEP_SUMMARY
        echo "    <groupId>com.ultikits</groupId>" >> $GITHUB_STEP_SUMMARY
        echo "    <artifactId>ultitools-api</artifactId>" >> $GITHUB_STEP_SUMMARY
        echo "    <version>${VERSION}</version>" >> $GITHUB_STEP_SUMMARY
        echo "    <scope>provided</scope>" >> $GITHUB_STEP_SUMMARY
        echo "</dependency>" >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "> **Note**: GitHub Packages requires lowercase artifact IDs." >> $GITHUB_STEP_SUMMARY
        echo "> For Maven Central, use \`UltiTools-API\` (original case)." >> $GITHUB_STEP_SUMMARY

    # Documentation sync for this release is tracked by the existing UltiTools-Dev-Doc issues (#100,
    # #132), so this workflow no longer opens a duplicate "docs: sync" issue.

  publish-central:
    name: 📤 Maven Central
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      contents: read
    if: ${{ vars.PUBLISH_TO_CENTRAL == 'true' }}

    steps:
    - name: 📥 Checkout code
      # The tag's commit; release_artifacts.py checks the retained files against it.
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4 (v4.3.1)

    - name: ☕ Set up JDK 21 with Sonatype credentials
      uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4 (v4.8.0)
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
        server-id: ultikits-sonatype
        server-username: SONATYPE_USERNAME
        server-password: SONATYPE_PASSWORD
        gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
        gpg-passphrase: MAVEN_GPG_PASSPHRASE

    - name: 🔐 Configure GPG agent for CI
      run: |
        echo "allow-loopback-pinentry" >> ~/.gnupg/gpg-agent.conf
        echo "pinentry-mode loopback" >> ~/.gnupg/gpg.conf
        gpg-connect-agent reloadagent /bye || true

    - name: 🔑 Check GPG key expiry
      # Placed after the key is imported and before anything is signed. The key is already in the
      # runner's keyring by this point, so this needs no extra secret and no network access.
      #
      # If it has expired, fail here and say plainly that it is expiry, not a missing key -- GPG
      # skips an expired key when choosing its default, so signing reports "no default secret
      # key", which is easily misread as the key having failed to import, prompting a needless
      # re-generation; the correct fix is to extend the key's validity.
      #
      # Fewer than 30 days remaining only warns, it does not block the release: signing with a
      # key that still has three weeks of validity is entirely legitimate, and the signature
      # remains verifiable after the key expires. Not passing --fail-on-warn here is exactly
      # what that means.
      run: .github/scripts/check-gpg-expiry.sh --mode secret --warn-days 30

    - name: 📥 Download and verify the retained release files
      # Publication consumes the bytes that were accepted, never a new build. release.sh --prepare built
      # one candidate and retained its primary JAR, POM, sources and javadoc JARs with a SHA-256 manifest;
      # UAT and the maintainer accepted exactly those bytes, and release.sh --publish-approved attached
      # them to this release. A rebuild here would differ at least in ZIP timestamps, so its hash would
      # no longer be the one UAT holds. This step downloads the five assets and checks the manifest, every
      # size and raw SHA-256, the source commit, tree and pom.xml bytes, and that the tag names the
      # accepted commit. Any missing or changed asset stops the job before anything is published.
      id: retained
      env:
        VERSION: ${{ needs.validate.outputs.version }}
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        INPUTS="$RUNNER_TEMP/retained-inputs"
        BASE="UltiTools-API-${VERSION}"
        mkdir "$INPUTS"
        gh release download "$GITHUB_REF_NAME" --dir "$INPUTS" \
          --pattern "${BASE}.jar" --pattern "${BASE}.pom" --pattern "${BASE}-sources.jar" \
          --pattern "${BASE}-javadoc.jar" --pattern "${BASE}-release-manifest.json"
        python3 -I .github/scripts/release_artifacts.py validate \
          --manifest "$INPUTS/${BASE}-release-manifest.json" --source-checkout "$GITHUB_WORKSPACE" \
          --expected-source-head "$GITHUB_SHA" --tag "$GITHUB_REF_NAME"
        echo "inputs=$INPUTS" >> "$GITHUB_OUTPUT"
    - name: 🔍 Check Maven Central for this coordinate
      # Coordinates on Maven Central are immutable. Absent -> publish; the same bytes already served ->
      # a successful no-op (a re-run after an interrupted job); different bytes, a partial coordinate or
      # an unreadable answer -> fail, never publish over it.
      id: central-state
      env:
        VERSION: ${{ needs.validate.outputs.version }}
        INPUTS: ${{ steps.retained.outputs.inputs }}
      run: |
        set -euo pipefail
        STATE="$(python3 -I .github/scripts/release_artifacts.py repository-state \
          --manifest "$INPUTS/UltiTools-API-${VERSION}-release-manifest.json" \
          --base-url https://repo1.maven.org/maven2 --artifact-id UltiTools-API)"
        case "$STATE" in
          STATE=absent)
            echo "publish=true" >> "$GITHUB_OUTPUT" ;;
          STATE=identical)
            echo "::notice::Maven Central already serves these exact bytes; nothing is published."
            echo "publish=false" >> "$GITHUB_OUTPUT" ;;
          *)
            echo "::error::unexpected Maven Central state [${STATE}]"
            exit 1 ;;
        esac

    - name: ✍️ Sign the retained files
      # Detached signatures beside the retained files; the files themselves are never modified. Central
      # requires a signature for the POM and for each JAR.
      if: steps.central-state.outputs.publish == 'true'
      env:
        VERSION: ${{ needs.validate.outputs.version }}
        INPUTS: ${{ steps.retained.outputs.inputs }}
        MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
      run: |
        set -euo pipefail
        BASE="UltiTools-API-${VERSION}"
        for FILE in "${BASE}.pom" "${BASE}.jar" "${BASE}-sources.jar" "${BASE}-javadoc.jar"; do
          gpg --batch --pinentry-mode loopback --passphrase-fd 0 --armor --detach-sign \
            --output "$INPUTS/${FILE}.asc" "$INPUTS/${FILE}" <<< "$MAVEN_GPG_PASSPHRASE"
        done

    - name: 🧩 Prepare the retained-artifact registrar
      # release_artifacts.py central-inputs re-checks the retained files, verifies the four signatures,
      # writes a private list of the exact files (GAV, path, size, SHA-256, type, classifier) and compiles
      # only .github/scripts/maven/RetainedArtifactsParticipant.java against this Maven distribution into
      # an ephemeral helper JAR. No product source, POM or lifecycle is built. The helper directory and the
      # publisher's scratch directory are new and disjoint from the retained inputs.
      id: registrar
      if: steps.central-state.outputs.publish == 'true'
      env:
        VERSION: ${{ needs.validate.outputs.version }}
        INPUTS: ${{ steps.retained.outputs.inputs }}
      run: |
        set -euo pipefail
        MAVEN_HOME="$(mvn -B -v | sed -n 's/^Maven home: //p')"
        python3 -I .github/scripts/release_artifacts.py central-inputs \
          --manifest "$INPUTS/UltiTools-API-${VERSION}-release-manifest.json" \
          --source-checkout "$GITHUB_WORKSPACE" --expected-source-head "$GITHUB_SHA" --tag "$GITHUB_REF_NAME" \
          --maven-home "$MAVEN_HOME" --work-dir "$RUNNER_TEMP/central-helper" \
          --scratch-dir "$RUNNER_TEMP/central-scratch" --shell > "$RUNNER_TEMP/central-inputs.env"
        while IFS='=' read -r KEY VALUE; do
          echo "$(printf '%s' "$KEY" | tr 'A-Z' 'a-z')=${VALUE}" >> "$GITHUB_OUTPUT"
        done < "$RUNNER_TEMP/central-inputs.env"

    - name: 📤 Publish the retained files to Maven Central
      # The existing central-publishing-maven-plugin is the only transport, invoked as a single goal on the
      # retained POM; no clean/package/verify/deploy phase runs. The registrar, loaded as a core extension,
      # assigns the retained primary JAR and attaches the sources and javadoc JARs and the four signatures;
      # the retained POM is the project file and is staged unchanged. The plugin clears its scratch
      # directories on the first project, which is why the retained inputs live elsewhere. The working
      # directory is the runner's temporary directory, so no project configuration from the checkout is read.
      if: steps.central-state.outputs.publish == 'true'
      env:
        SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
        SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
        RETAINED_POM: ${{ steps.registrar.outputs.retained_pom }}
        HELPER_JAR: ${{ steps.registrar.outputs.helper_jar }}
        PROPERTIES: ${{ steps.registrar.outputs.properties }}
        STAGING_DIR: ${{ steps.registrar.outputs.staging_dir }}
        DEFERRED_DIR: ${{ steps.registrar.outputs.deferred_dir }}
        OUTPUT_DIR: ${{ steps.registrar.outputs.output_dir }}
      run: |
        set -euo pipefail
        cd "$RUNNER_TEMP"
        mvn -B -f "$RETAINED_POM" \
          -Dmaven.ext.class.path="$HELPER_JAR" -DretainedArtifacts.properties="$PROPERTIES" \
          -DstagingDirectory="$STAGING_DIR" -DdeferredDirectory="$DEFERRED_DIR" -DoutputDirectory="$OUTPUT_DIR" \
          org.sonatype.central:central-publishing-maven-plugin:0.9.0:publish \
          -DpublishingServerId=ultikits-sonatype -DautoPublish=true -DwaitUntil=published -Dchecksums=all

    - name: 🔁 Re-check the retained files after publication
      if: steps.central-state.outputs.publish == 'true'
      env:
        VERSION: ${{ needs.validate.outputs.version }}
        INPUTS: ${{ steps.retained.outputs.inputs }}
        PROPERTIES: ${{ steps.registrar.outputs.properties }}
      run: |
        set -euo pipefail
        python3 -I .github/scripts/release_artifacts.py central-recheck \
          --manifest "$INPUTS/UltiTools-API-${VERSION}-release-manifest.json" --properties "$PROPERTIES"
