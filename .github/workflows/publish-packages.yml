name: 📦 Publish Release

on:
  release:
    types: [published]

jobs:
  validate:
    name: 🏷️ Validate tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
    - name: 🏷️ Extract and validate version from tag
      # 两个发布 job 都从这里取版本号，不再各自解析一次 GITHUB_REF_NAME。
      # 少一份重复就少一处漂移——往 Maven Central 推出去的坐标不可撤销
      # （Central 不允许覆盖或删除已发布的坐标），两个 job 用的必须是同一个
      # 且已经校验过的字符串。
      #
      # 这一层挡的是绕过 .github/scripts/release.sh 的路径：直接在 GitHub 网页上
      # 建 release，或者手工推一个 tag。入口脚本能在打 tag 之前拒绝，但只在有人
      # 走它的时候生效；这里挡不住 tag 被创建，挡得住坏版本号被发出去。
      id: version
      run: |
        set -euo pipefail
        VERSION="${GITHUB_REF_NAME#v}"
        if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "::error::tag ${GITHUB_REF_NAME} 解析出的版本号不符合 MAJOR.MINOR.PATCH，发布已中止。"
          echo "::error::解析结果为 [${VERSION}]。请删除该 release 与 tag，用正确的版本号重新发布。"
          exit 1
        fi
        echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
        echo "${GITHUB_REF_NAME} -> ${VERSION}"

  publish-github:
    name: 📦 GitHub Packages
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      # contents: write —— 往 release 挂 JAR 附件需要。
      contents: write
      packages: write

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4 (v4.3.1)

    - name: ☕ Set up JDK 21
      uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4 (v4.8.0)
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: 🔧 Set version from release tag
      env:
        VERSION: ${{ needs.validate.outputs.version }}
      run: mvn versions:set -DnewVersion="${VERSION}" -DgenerateBackupPoms=false

    - name: 🔨 Build package
      # GitHub Packages 不要求签名，因此不激活 release profile。
      run: mvn -B clean package -Dmaven.test.skip=true

    - name: 📎 Attach JAR to the release
      # 兜底，不是主路径。发布入口 .github/scripts/release.sh 建 release 时就会带上 JAR，
      # 但那条路依赖维护者记得用它。直接在 GitHub 网页上建 release 一样会走到这里。
      #
      # v6.2.1--v6.2.4 四个 release 全是零附件，正是因为当时只有「记得手动传」这一条路；
      # 仓库里曾经有一个更完整的 release.yml，但一次都没被跑过，也没能挡住
      # （已随 #231 删除）。所以这一层要放在不依赖记性的地方。
      #
      # --clobber 让它幂等：入口脚本已经传过同名附件时覆盖，而不是报错退出。
      env:
        VERSION: ${{ needs.validate.outputs.version }}
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -euo pipefail
        # 必须写全文件名。target/ 下 mvn package 会留下四个 jar：主 JAR、
        # original-（shade 之前的原始包）、-sources、-javadoc。用通配符的话
        # 字典序会先命中 original-，那是个没经过 shade 的包，看起来正常但缺少
        # 被重定位的依赖。
        JAR="target/UltiTools-API-${VERSION}.jar"
        if [ ! -f "$JAR" ]; then
          echo "::error::构建完成但找不到 ${JAR}。"
          exit 1
        fi
        gh release upload "${GITHUB_REF_NAME}" "$JAR" --clobber

    - name: 📦 Publish to GitHub Packages
      id: publish-ghp
      env:
        VERSION: ${{ needs.validate.outputs.version }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        printf '<settings><servers><server><id>github</id><username>${env.GITHUB_ACTOR}</username><password>${env.GITHUB_TOKEN}</password></server></servers></settings>' > /tmp/gh-settings.xml
        JAR_PATH="$(pwd)/target/UltiTools-API-${VERSION}.jar"
        cd /tmp
        if mvn deploy:deploy-file \
          -s /tmp/gh-settings.xml \
          -DgroupId=com.ultikits \
          -DartifactId=ultitools-api \
          -Dversion="${VERSION}" \
          -Dpackaging=jar \
          -Dfile="${JAR_PATH}" \
          -DgeneratePom=true \
          -DrepositoryId=github \
          -Durl=https://maven.pkg.github.com/UltiKits/UltiTools-Reborn; then
          echo "result=published" >> $GITHUB_OUTPUT
        else
          echo "::warning::Version ${VERSION} may already exist in GitHub Packages (409 Conflict is expected on re-runs)"
          echo "result=already-exists" >> $GITHUB_OUTPUT
        fi

    - name: 📝 Publish Summary
      env:
        VERSION: ${{ needs.validate.outputs.version }}
      run: |
        echo "## Published to GitHub Packages" >> $GITHUB_STEP_SUMMARY
        echo '```xml' >> $GITHUB_STEP_SUMMARY
        echo "<dependency>" >> $GITHUB_STEP_SUMMARY
        echo "    <groupId>com.ultikits</groupId>" >> $GITHUB_STEP_SUMMARY
        echo "    <artifactId>ultitools-api</artifactId>" >> $GITHUB_STEP_SUMMARY
        echo "    <version>${VERSION}</version>" >> $GITHUB_STEP_SUMMARY
        echo "    <scope>provided</scope>" >> $GITHUB_STEP_SUMMARY
        echo "</dependency>" >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "> **Note**: GitHub Packages requires lowercase artifact IDs." >> $GITHUB_STEP_SUMMARY
        echo "> For Maven Central, use \`UltiTools-API\` (original case)." >> $GITHUB_STEP_SUMMARY

    - name: 📖 Open documentation sync issue
      # 从 release.yml 搬过来（#231）。那个 workflow 一次都没跑过，所以这段逻辑
      # 此前从未真正执行；放到这里之后它才开始工作。
      #
      # 位置在 job 末尾：先把包发出去，再提醒同步文档。
      # continue-on-error —— 文档同步是发布之后的事，token 失效不该把一次
      # 已经成功的发布标成失败。
      env:
        GH_TOKEN: ${{ secrets.DOCS_REPO_TOKEN }}
        VERSION: ${{ needs.validate.outputs.version }}
      continue-on-error: true
      run: |
        # 空 token 在脚本里判，不用 step 级的 `if: env.GH_TOKEN != ''`。
        # step 自己 env 块里的变量能否被同一个 step 的 if 读到，文档上并不明确；
        # 万一读不到，条件恒假，这一步会永远静默跳过，外观和「因为没配 token
        # 而正常跳过」完全一样——正是 release.yml 那种「写得对但从不执行」的形状。
        # 挪进 bash 就没有这层不确定性，而且跳过时留得下一条可见的 warning。
        if [ -z "${GH_TOKEN:-}" ]; then
          echo "::warning::DOCS_REPO_TOKEN 未配置，跳过文档同步 issue。"
          exit 0
        fi
        gh issue create \
          --repo UltiKits/UltiTools-Dev-Doc \
          --title "docs: sync v${VERSION}" \
          --body "$(cat <<EOF
        UltiTools-API v${VERSION} 已发布，文档需要同步。

        - [ ] \`examples/pom.xml\` 的 \`<ultitools.version>\` 更新为 ${VERSION}
        - [ ] \`.vitepress/config.mts\` 的 \`versionsConfig.current\` 更新为 v${VERSION}，并把 \`docs/src/\` 快照进 \`docs/archive/\`
        - [ ] \`mvn -f examples/pom.xml compile\` 通过（编译失败的示例即需要改的页面）
        - [ ] 跑 \`./scripts/report-doc-coverage.sh 6.2.4 ${VERSION}\`（第一个参数替换为上一个正式发布版本号，示例中的 6.2.4 仅供参考）并处理报告中的两段清单

        关闭本 issue 即代表本次同步完成。
        EOF
        )"

  publish-central:
    name: 📤 Maven Central
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      contents: read
    if: ${{ vars.PUBLISH_TO_CENTRAL == 'true' }}

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4 (v4.3.1)

    - name: ☕ Set up JDK 21 with Sonatype credentials
      uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4 (v4.8.0)
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
        server-id: ultikits-sonatype
        server-username: SONATYPE_USERNAME
        server-password: SONATYPE_PASSWORD
        gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
        gpg-passphrase: MAVEN_GPG_PASSPHRASE

    - name: 🔐 Configure GPG agent for CI
      run: |
        echo "allow-loopback-pinentry" >> ~/.gnupg/gpg-agent.conf
        echo "pinentry-mode loopback" >> ~/.gnupg/gpg.conf
        gpg-connect-agent reloadagent /bye || true

    - name: 🔑 Check GPG key expiry
      # 放在导入密钥之后、mvn deploy 之前。密钥此时已在 runner 的钥匙串里，
      # 不需要额外 secret 也不需要联网。
      #
      # 已过期就在这里失败，并明说是过期而不是密钥丢失——GPG 挑默认密钥时会跳过
      # 已过期的，所以 gpg:sign 报的是 "no default secret key"，很容易被误判成
      # 密钥没导入成功而去重新生成，正确处置是延长有效期。
      #
      # 剩余不足 30 天只告警、不拦发版：用一把还有三周有效期的密钥签名完全合法，
      # 签名在密钥过期之后依然可验证。这里没有传 --fail-on-warn 就是这个意思。
      run: .github/scripts/check-gpg-expiry.sh --mode secret --warn-days 30

    - name: 🔧 Set version from release tag
      env:
        VERSION: ${{ needs.validate.outputs.version }}
      run: mvn versions:set -DnewVersion="${VERSION}" -DgenerateBackupPoms=false

    - name: 📤 Publish to Maven Central
      env:
        SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
        SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
        MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
      # -P release：GPG 签名只在这个 profile 里，唯独 Maven Central 需要签名产物。
      # 漏掉它不会静默发出未签名产物，Central 的校验会直接拒绝。
      run: mvn -B deploy -P release -Dmaven.test.skip=true -Dgpg.passphrase="${MAVEN_GPG_PASSPHRASE}"
