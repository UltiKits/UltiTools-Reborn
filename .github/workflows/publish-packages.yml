name: 📦 Publish Release

on:
  release:
    types: [published]

jobs:
  validate:
    name: 🏷️ Validate tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
    - name: 🏷️ Extract and validate version from tag
      # Both publish jobs get the version from here now, instead of each parsing GITHUB_REF_NAME
      # separately. One fewer duplication means one fewer place to drift — coordinates pushed to
      # Maven Central are irrevocable (Central does not allow overwriting or deleting a published
      # coordinate), so both jobs must use the same, already-validated string.
      #
      # This layer guards the path that bypasses .github/scripts/release.sh: creating a release
      # directly on the GitHub web UI, or manually pushing a tag. The entry-point script can
      # refuse before a tag is even created, but only when someone actually runs it; this layer
      # cannot stop a tag from being created, but it can stop a bad version number from being
      # published.
      id: version
      run: |
        set -euo pipefail
        VERSION="${GITHUB_REF_NAME#v}"
        if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "::error::the version parsed from tag ${GITHUB_REF_NAME} does not match MAJOR.MINOR.PATCH; the release has been aborted."
          echo "::error::parsed result was [${VERSION}]. Delete this release and tag, then re-publish with the correct version number."
          exit 1
        fi
        echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
        echo "${GITHUB_REF_NAME} -> ${VERSION}"

  publish-github:
    name: 📦 GitHub Packages
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      # contents: write -- needed to attach the JAR asset to the release.
      contents: write
      packages: write

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4 (v4.3.1)

    - name: ☕ Set up JDK 21
      uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4 (v4.8.0)
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: 🔧 Set version from release tag
      env:
        VERSION: ${{ needs.validate.outputs.version }}
      run: mvn versions:set -DnewVersion="${VERSION}" -DgenerateBackupPoms=false

    - name: 🔨 Build package
      # GitHub Packages does not require signing, so the release profile is not activated.
      run: mvn -B clean package -Dmaven.test.skip=true

    - name: 📎 Attach JAR to the release
      # A fallback, not the primary path. The publish entry point .github/scripts/release.sh
      # attaches the JAR when it creates the release, but that path relies on the maintainer
      # remembering to use it. Creating a release directly on the GitHub web UI ends up here too.
      #
      # The four releases v6.2.1--v6.2.4 all shipped with zero attachments, precisely because
      # "remember to upload it by hand" was the only path back then; the repository once had a
      # more complete release.yml, but it was never run even once and never caught this either
      # (deleted along with #231). So this layer has to live somewhere that does not depend on
      # memory.
      #
      # The idempotent behaviour is "skip if it already exists", not "--clobber overwrite".
      # release.sh takes the path of "local clean build -> verify JAR contents -> print sha256 ->
      # create together with the attachment", and the sha256 it prints is what gets sent to
      # real-machine UAT. This step runs on release:published and rebuilds -- semantically
      # identical but with a different ZIP timestamp, so the hash is guaranteed not to match.
      # Overwriting would invalidate the sha256 UAT is holding, and the distributed artifact
      # would no longer be the one that passed local verification.
      env:
        VERSION: ${{ needs.validate.outputs.version }}
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -euo pipefail
        # The full file name must be spelled out. mvn package leaves four jars under target/:
        # the main JAR, original- (the pre-shade artifact), -sources, and -javadoc. A wildcard
        # would match original- first in dictionary order, which is an unshaded artifact -- it
        # looks normal but is missing its relocated dependencies.
        JAR="target/UltiTools-API-${VERSION}.jar"
        if [ ! -f "$JAR" ]; then
          echo "::error::build completed but ${JAR} was not found."
          exit 1
        fi
        ASSET="$(basename "$JAR")"
        # The pipeline is inside an if condition, so errexit/pipefail will not exit the script
        # outright; if gh cannot find it, treat it as the asset not existing and fall through to
        # the else branch to upload it -- this is the safe direction to degrade in.
        if gh release view "${GITHUB_REF_NAME}" --json assets \
             --jq '.assets[].name' | grep -qxF "$ASSET"; then
          echo "✅ ${ASSET} is already a release asset -- leaving it as is."
          echo "   It came from release.sh's local build, and its sha256 was already used for real-machine UAT."
        else
          echo "▶ ${ASSET} is not on the release -- uploading this CI build's artifact."
          gh release upload "${GITHUB_REF_NAME}" "$JAR"
        fi

    - name: 📦 Publish to GitHub Packages
      id: publish-ghp
      env:
        VERSION: ${{ needs.validate.outputs.version }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        printf '<settings><servers><server><id>github</id><username>${env.GITHUB_ACTOR}</username><password>${env.GITHUB_TOKEN}</password></server></servers></settings>' > /tmp/gh-settings.xml
        JAR_PATH="$(pwd)/target/UltiTools-API-${VERSION}.jar"
        cd /tmp
        if mvn deploy:deploy-file \
          -s /tmp/gh-settings.xml \
          -DgroupId=com.ultikits \
          -DartifactId=ultitools-api \
          -Dversion="${VERSION}" \
          -Dpackaging=jar \
          -Dfile="${JAR_PATH}" \
          -DgeneratePom=true \
          -DrepositoryId=github \
          -Durl=https://maven.pkg.github.com/UltiKits/UltiTools-Reborn; then
          echo "result=published" >> $GITHUB_OUTPUT
        else
          echo "::warning::Version ${VERSION} may already exist in GitHub Packages (409 Conflict is expected on re-runs)"
          echo "result=already-exists" >> $GITHUB_OUTPUT
        fi

    - name: 📝 Publish Summary
      env:
        VERSION: ${{ needs.validate.outputs.version }}
      run: |
        echo "## Published to GitHub Packages" >> $GITHUB_STEP_SUMMARY
        echo '```xml' >> $GITHUB_STEP_SUMMARY
        echo "<dependency>" >> $GITHUB_STEP_SUMMARY
        echo "    <groupId>com.ultikits</groupId>" >> $GITHUB_STEP_SUMMARY
        echo "    <artifactId>ultitools-api</artifactId>" >> $GITHUB_STEP_SUMMARY
        echo "    <version>${VERSION}</version>" >> $GITHUB_STEP_SUMMARY
        echo "    <scope>provided</scope>" >> $GITHUB_STEP_SUMMARY
        echo "</dependency>" >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "> **Note**: GitHub Packages requires lowercase artifact IDs." >> $GITHUB_STEP_SUMMARY
        echo "> For Maven Central, use \`UltiTools-API\` (original case)." >> $GITHUB_STEP_SUMMARY

    - name: 📖 Open documentation sync issue
      # Moved over from release.yml (#231). That workflow was never run even once, so this logic
      # had never actually executed before; it only starts working once it lands here.
      #
      # Placed at the end of the job: publish the package first, then remind about doc sync.
      # continue-on-error -- doc sync is a post-publish concern, and a stale token should not
      # mark an already-successful release as failed.
      env:
        GH_TOKEN: ${{ secrets.DOCS_REPO_TOKEN }}
        VERSION: ${{ needs.validate.outputs.version }}
      continue-on-error: true
      run: |
        # The empty-token check is done inside the script, not via a step-level
        # `if: env.GH_TOKEN != ''`. Whether a variable in a step's own env block is readable by
        # that same step's if is not clearly documented; if it is not readable, the condition is
        # always false, and this step would silently skip forever -- looking exactly like
        # "skipped normally because no token is configured", which is the same shape as
        # release.yml's "written correctly but never actually runs" failure. Moving it into bash
        # removes that uncertainty, and leaves a visible warning behind when it does skip.
        if [ -z "${GH_TOKEN:-}" ]; then
          echo "::warning::DOCS_REPO_TOKEN is not configured -- skipping the doc-sync issue."
          exit 0
        fi
        gh issue create \
          --repo UltiKits/UltiTools-Dev-Doc \
          --title "docs: sync v${VERSION}" \
          --body "$(cat <<EOF
        UltiTools-API v${VERSION} has been published; the documentation needs to be synced.

        - [ ] Update \`examples/pom.xml\`'s \`<ultitools.version>\` to ${VERSION}
        - [ ] Update \`.vitepress/config.mts\`'s \`versionsConfig.current\` to v${VERSION}, and snapshot \`docs/src/\` into \`docs/archive/\`
        - [ ] \`mvn -f examples/pom.xml compile\` passes (a compile failure names the example page that needs updating)
        - [ ] Run \`./scripts/report-doc-coverage.sh 6.2.4 ${VERSION}\` (replace the first argument with the previous released version; the 6.2.4 in this example is illustrative only) and address both lists in the report

        Closing this issue marks this sync as complete.
        EOF
        )"

  publish-central:
    name: 📤 Maven Central
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      contents: read
    if: ${{ vars.PUBLISH_TO_CENTRAL == 'true' }}

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4 (v4.3.1)

    - name: ☕ Set up JDK 21 with Sonatype credentials
      uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4 (v4.8.0)
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
        server-id: ultikits-sonatype
        server-username: SONATYPE_USERNAME
        server-password: SONATYPE_PASSWORD
        gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
        gpg-passphrase: MAVEN_GPG_PASSPHRASE

    - name: 🔐 Configure GPG agent for CI
      run: |
        echo "allow-loopback-pinentry" >> ~/.gnupg/gpg-agent.conf
        echo "pinentry-mode loopback" >> ~/.gnupg/gpg.conf
        gpg-connect-agent reloadagent /bye || true

    - name: 🔑 Check GPG key expiry
      # Placed after the key is imported and before mvn deploy. The key is already in the
      # runner's keyring by this point, so this needs no extra secret and no network access.
      #
      # If it has expired, fail here and say plainly that it is expiry, not a missing key -- GPG
      # skips an expired key when choosing its default, so gpg:sign reports "no default secret
      # key", which is easily misread as the key having failed to import, prompting a needless
      # re-generation; the correct fix is to extend the key's validity.
      #
      # Fewer than 30 days remaining only warns, it does not block the release: signing with a
      # key that still has three weeks of validity is entirely legitimate, and the signature
      # remains verifiable after the key expires. Not passing --fail-on-warn here is exactly
      # what that means.
      run: .github/scripts/check-gpg-expiry.sh --mode secret --warn-days 30

    - name: 🔧 Set version from release tag
      env:
        VERSION: ${{ needs.validate.outputs.version }}
      run: mvn versions:set -DnewVersion="${VERSION}" -DgenerateBackupPoms=false

    - name: 📤 Publish to Maven Central
      env:
        SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
        SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
        MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
      # -P release: GPG signing lives only in this profile, since Maven Central alone requires
      # signed artifacts. Omitting it would not silently ship an unsigned artifact -- Central's
      # own validation rejects it outright.
      run: mvn -B deploy -P release -Dmaven.test.skip=true -Dgpg.passphrase="${MAVEN_GPG_PASSPHRASE}"
