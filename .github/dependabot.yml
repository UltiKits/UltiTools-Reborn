# Monthly dependency updates against the sole integration branch.
version: 2
updates:
  - package-ecosystem: "maven"
    directory: "/"
    target-branch: "main"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 10
    groups:
      maven-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # JUnit 6 requires Java 17; tests retain the JUnit 5 API for this Java 8-bytecode project.
      - dependency-name: "org.junit.jupiter:*"
        versions: [">=6"]
      # Real-engine test drivers are bumped by hand together with paper-api.
      - dependency-name: "com.mysql:mysql-connector-j"
      - dependency-name: "org.xerial:sqlite-jdbc"
      # Adventure 5 is incompatible with the Adventure 4 API supplied by Paper.
      - dependency-name: "net.kyori:*"
        versions: [">=5"]
      # SnakeYAML artifacts are deliberate old-version test fixtures.
      - dependency-name: "org.yaml:snakeyaml"
      # Compile-only APIs provided by Paper.
      - dependency-name: "org.apache.logging.log4j:*"
      - dependency-name: "com.google.code.gson:gson"
      # Release tooling pin; upgrade only with the retained-artifact publisher.
      - dependency-name: "org.sonatype.central:central-publishing-maven-plugin"
      # Mockito already runs on JDK 21, but a new major needs a reviewed JDK/API baseline.
      - dependency-name: "org.mockito:*"
        versions: [">=6"]
      # Paper 26.x moves beyond the JDK 21 / Paper 1.21 compile-time baseline.
      - dependency-name: "io.papermc.paper:paper-api"
        versions: ["<1.21", ">=1.22"]

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "main"
    schedule:
      interval: "monthly"
    groups:
      github-actions:
        patterns: ["*"]
